name: Self-Check

permissions:
  contents: read

# A group here is unremarkable, unlike in the workflows this one calls: no
# caller ever reaches this file, so github.workflow and github.ref name this
# repository's own run and nothing has to be added to keep it distinct.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# What this repository runs against itself. Everything else here exists to be
# called by xstd-misc, xstd-ints, xstd-bits, tabula and dctl; this is the one
# workflow that is only ever about cpp-ci.
#
# Keeping it separate is what lets codeql.yml and actionlint.yml go back to
# being workflow_call and nothing else. codeql.yml previously carried its own
# push and pull_request triggers and told its two jobs apart by whether the
# inputs context was empty, which meant a caller's C++ job appeared on this
# repository's own pull requests as a permanent "skipped" - reported, never
# run, and easy to misread as a check that had been turned off.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

jobs:
  # The same workflow the callers use, run against this repository. Its pin
  # check is guarded on github.repository, which is cpp-ci here, so it fires.
  actionlint:
    uses: ./.github/workflows/actionlint.yml

  # actions reads the workflows and composite actions; python reads
  # check_internal_pins.py. Neither needs a compiler, so both run with
  # build-mode: none and the analysis is the whole job.
  codeql:
    name: codeql
    runs-on: ubuntu-24.04

    # security-events to file the findings, actions to let the extractor read
    # the workflows it is analyzing. Job level rather than workflow level, for
    # the reason codeql.yml gives: Scorecard's Token-Permissions subtracts a
    # point for a top-level security-events write and nothing for the same
    # grant on a job.
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [ actions, python ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

  # install-gcc's librarian route, forced: every caller's GCC and Clang legs
  # already exercise the PPA route, and the librarian route runs only when the
  # PPA's mirror is down, which is too late to find it broken. The stable rung
  # plain and the qualification rung with multilib cover both package sets.
  install-gcc:
    name: install-gcc (librarian, ${{ matrix.rung }}${{ matrix.multilib == 'true' && ', multilib' || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - rung: stable
            multilib: "false"
          - rung: qualification
            multilib: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the librarian's unit tests
        run: python3 -I .github/actions/install-gcc/test_librarian.py -v

      - name: Resolve the rung's GCC
        id: gcc
        env:
          RUNG: ${{ matrix.rung }}
        run: echo "version=$(jq -r --arg rung "$RUNG" '.gcc[$rung].version' .github/actions/toolchain/toolchains.json)" >> "$GITHUB_OUTPUT"

      - name: Install GCC ${{ steps.gcc.outputs.version }} from the librarian
        uses: ./.github/actions/install-gcc
        with:
          version: ${{ steps.gcc.outputs.version }}
          trunk: "false"
          multilib: ${{ matrix.multilib }}
          source: librarian

      - name: Build and run a program with it
        env:
          VERSION: ${{ steps.gcc.outputs.version }}
          MULTILIB: ${{ matrix.multilib }}
        run: |
          set -euo pipefail
          printf '#include <print>\nauto main() -> int { std::println("{}", __VERSION__); }\n' > hello.cpp
          "g++-${VERSION}" -std=c++23 hello.cpp -o hello
          ./hello
          if [ "$MULTILIB" = "true" ]; then
            "g++-${VERSION}" -std=c++23 -m32 hello.cpp -o hello32
            ./hello32
          fi

  # The standard-library test-suite adapter's marker readers and mapping
  # checks, on lines the suites carry. No suite is fetched: what a fetch
  # returns is the consumers' to classify, on their own legs.
  std-test-suite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the adapter's unit tests
        run: python3 -I cmake/test_std_test_suite.py -v

      - name: Run the pin bump's unit tests
        run: python3 -I .github/scripts/test_bump_test_suites.py -v

  # The layering action's five rules, and its configuration checks, on a small
  # tree laid out as a library would be. The callers run it on their own trees.
  layering:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the layering check's unit tests
        run: python3 -I .github/actions/layering/test_layering.py -v

  # tools/ci_local.py, the local runner, on fixture stubs: the legs it derives
  # from a caller's workflows, their names and order, the inputs and tiers it
  # resolves, and the command lines it builds. No compiler runs. PyYAML comes
  # at the pin the pin check installs, into a virtual environment, which
  # python3 -I still reads where it ignores the user's site-packages.
  ci-local:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PyYAML at its pin
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes -r .github/scripts/requirements.txt

      - name: Run the local runner's unit tests
        run: '"$RUNNER_TEMP/venv/bin/python" -I tools/test_ci_local.py -v'

  # tools/setup-toolchain.sh, the local install of what the workflows build
  # with, on a fresh runner as a developer runs it: every compiler and tool it
  # names must be on PATH and build a program, at the stable rungs alone and
  # at every rung. The stable mode also installs Boost.Test from Boost's
  # release tarball, which a test program links with the stable GCC, and
  # tools/boost-test.sh builds it again for libc++. The stable mode runs on
  # arm64 too, as a caller's arm64 jobs install that rung through it.
  setup-toolchain:
    name: setup-toolchain (${{ matrix.mode }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: stable
            runner: ubuntu-24.04
            flags: --stable --boost test
          - mode: stable
            runner: ubuntu-24.04-arm
            flags: --stable --boost test
          - mode: every rung
            runner: ubuntu-24.04
            flags: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/apt-retry

      - name: Install the toolchain
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          set -euo pipefail
          read -ra flags <<< "$FLAGS"
          tools/setup-toolchain.sh "${flags[@]}"

      - name: Run it again, which must install nothing
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          set -euo pipefail
          read -ra flags <<< "$FLAGS"
          start=$SECONDS
          tools/setup-toolchain.sh "${flags[@]}"
          echo "second run: $((SECONDS - start)) s"

      - name: Build a program with every compiler it installed
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          table=.github/actions/toolchain/toolchains.json
          tiers=(stable)
          [ "$MODE" = stable ] || tiers+=(qualification development)
          printf '#include <print>\nauto main() -> int { std::println("{}", __VERSION__); }\n' > hello.cpp
          for tier in "${tiers[@]}"; do
            gcc=$(jq -r --arg t "$tier" '.gcc[$t].version' "$table")
            clang=$(jq -r --arg t "$tier" '.clang[$t].version' "$table")
            "g++-$gcc" -std=c++23 hello.cpp -o hello && ./hello
            "clang++-$clang" -std=c++23 --gcc-install-dir="$("g++-$gcc" -print-file-name=)" hello.cpp -o hello && ./hello
            "clang-tidy-$clang" --version | head -1
          done
          stable=$(jq -r '.clang.stable.version' "$table")
          "clang++-$stable" -std=c++23 -stdlib=libc++ hello.cpp -o hello && ./hello
          "clang-format-$stable" --version
          "$HOME/.local/bin/gcovr" --version | head -1
          if [ "$MODE" != stable ]; then
            "g++-$(jq -r '.gcc.stable.version' "$table")" -m32 -std=c++23 hello.cpp -o hello && ./hello
            "$HOME/.local/bin/actionlint" --version
            "$HOME/.local/share/cpp-ci/vcpkg/vcpkg" version | head -1
          else
            # Neither is installed under --stable.
            ! command -v "$HOME/.local/bin/actionlint"
            [ ! -e "$HOME/.local/share/cpp-ci/vcpkg/vcpkg" ]
          fi
          if [ "$MODE" = stable ]; then
            printf '#define BOOST_TEST_MODULE hello\n#include <boost/test/unit_test.hpp>\nBOOST_AUTO_TEST_CASE(hello) { BOOST_TEST(1 + 1 == 2); }\n' > hello_test.cpp
            "g++-$(jq -r '.gcc.stable.version' "$table")" -std=c++23 hello_test.cpp -lboost_unit_test_framework -o hello_test && ./hello_test
            package=$(tools/boost-test.sh "$RUNNER_TEMP/boost-test" "clang++-$stable" -stdlib=libc++)
            "clang++-$stable" -std=c++23 -stdlib=libc++ hello_test.cpp -L"${package#*=}" -lboost_unit_test_framework -o hello_test && ./hello_test
          fi

  # The sanitizer ladder's legs crossed with rungs shaped as the toolchain
  # action emits them: by sanitizer-legs.sh's unit tests, then through the
  # action itself, so its matrix output is what a workflow reads.
  sanitizer-legs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the sanitizer legs' unit tests
        run: python3 -I .github/actions/sanitizer-legs/test_sanitizer_legs.py -v

      - name: Cross the legs through the action
        id: legs
        uses: ./.github/actions/sanitizer-legs
        with:
          gcc_rungs: '{"include":[{"label":"15","version":"15"}]}'
          clang_rungs: '{"include":[{"label":"22","version":"22","gcc_version":"15"}]}'
          libcxx_rungs: '{"include":[{"label":"22","version":"22","gcc_version":"15"}]}'

      - name: Require one entry per leg
        env:
          MATRIX: ${{ steps.legs.outputs.matrix }}
        run: |
          set -euo pipefail
          test "$(jq '.include | length' <<< "$MATRIX")" -eq 5

  # The coverage gate, gcovr.sh, on a small library-shaped fixture built with
  # the stable rung's GCC and its gcov, as coverage.yml builds a caller: an
  # uncovered line or branch fails it, an excluded path stays out, each
  # exclusion pattern has a case it is needed for, and the reports land where
  # the workflow's later steps read them.
  gcovr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/apt-retry

      - name: Resolve the stable rung
        id: toolchain
        uses: ./.github/actions/toolchain
        with:
          toolchain: gcc
          tier: stable

      - name: Install GCC
        uses: ./.github/actions/install-gcc
        with:
          version: ${{ steps.toolchain.outputs.version }}
          trunk: ${{ steps.toolchain.outputs.trunk }}

      - name: Install gcovr
        uses: ./.github/actions/install-gcovr

      - name: Run the coverage gate's tests
        env:
          VERSION: ${{ steps.toolchain.outputs.version }}
        run: CXX="g++-${VERSION}" GCOV="gcov-${VERSION}" python3 -I .github/actions/gcovr/test_gcovr.py -v

  # coverage.yml itself, as a caller's stub calls it, on test/coverage: a
  # header-only library whose Boost.Test suite vcpkg installs. The gate's own
  # rules are the gcovr leg's; this one catches the wiring around them -- the
  # configure flags, the install, the report steps' conditions -- which
  # actionlint reads but nothing runs. Codecov does not know this repository,
  # so the upload is off.
  #
  # id-token because coverage.yml asks for it at workflow level, for the
  # upload, and a called workflow cannot exceed its caller's grant.
  coverage:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/coverage.yml
    with:
      source_dir: test/coverage
      codecov: false

  # The drift report's grouping, pin reading and rendering on repositories held
  # in memory, then the action itself over the REST API. cpp-ci names no
  # caller, so it compares this repository with itself, at the merges of #102
  # and #104: .gitignore agrees, gcovr's action.yml differs, and test_gcovr.py
  # exists only in the newer, so exactly two files must drift.
  config-drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the drift report's unit tests
        run: python3 -I .github/actions/config-drift/test_drift.py -v

      - name: Report on two commits of this repository
        id: drift
        uses: ./.github/actions/config-drift
        with:
          repositories: rhalbersma/cpp-ci@ad68808 rhalbersma/cpp-ci@6ce8f73
          files: .gitignore .github/actions/gcovr/action.yml .github/actions/gcovr/test_gcovr.py

      - name: Require the two files that differ, and only those
        env:
          DRIFTED: ${{ steps.drift.outputs.drifted }}
        run: |
          set -euo pipefail
          echo "drifted: $DRIFTED"
          test "$DRIFTED" = ".github/actions/gcovr/action.yml .github/actions/gcovr/test_gcovr.py"

  # The compile budget's comparison and trace reading on data held in memory,
  # and its measurement of a small header tree under the stable rung's Clang.
  # Then the action itself, on test/coverage's header against the same tree as
  # its base: the counts are deterministic, so nothing may change and it must
  # pass. Nothing else here proves the counts repeat on a runner.
  compile-budget:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/apt-retry

      - name: Resolve the stable rung
        id: toolchain
        uses: ./.github/actions/toolchain
        with:
          toolchain: clang
          tier: stable

      - name: Install Clang
        uses: ./.github/actions/install-clang
        with:
          version: ${{ steps.toolchain.outputs.version }}
          llvm_suffix: ${{ steps.toolchain.outputs.llvm_suffix }}

      - name: Run the compile budget's tests
        env:
          VERSION: ${{ steps.toolchain.outputs.version }}
        run: CXX="clang++-${VERSION}" python3 -I .github/actions/compile-budget/test_budget.py -v

      - name: Measure test/coverage against itself
        uses: ./.github/actions/compile-budget
        with:
          root: test/coverage/include
          base_root: test/coverage/include
          cxx: clang++-${{ steps.toolchain.outputs.version }}
          flags: -std=c++20
          repeat: "1"

  # compile-budget.yml itself, as a stub calls it, on test/coverage's header.
  # On a pull request it checks out the merge base beside the head and must
  # find the header's counts unchanged unless the pull request changes it; on
  # a push or the schedule it reports the head alone.
  compile-budget-workflow:
    uses: ./.github/workflows/compile-budget.yml
    with:
      root: test/coverage/include
      flags: -std=c++20
      repeat: 1

  # One check name that does not move, for branch protection to require -- the
  # same role the "all" job has in gcc.yml and its siblings.
  #
  # Requiring this instead of the legs means a leg added here later is covered
  # without touching the repository's settings, which is the point: the failure
  # this guards against is a check that stops running and nobody noticing.
  all:
    # Spelled with the slash on purpose. Everywhere else in this family the
    # gate reads "gcc / all" or "msvc / all", because a caller's job supplies
    # the first half and cpp-ci's job the second. Nothing calls this workflow,
    # so there is no first half to inherit -- and a check called plain "all" in
    # a ruleset list, next to a caller's "gcc / all" and "msvc / all", says
    # nothing about what it gates. This is a display name chosen to match
    # them, not a reusable-workflow path.
    name: self-check / all
    needs: [ actionlint, codeql, install-gcc, setup-toolchain, std-test-suite, layering, ci-local, sanitizer-legs, gcovr, coverage, config-drift, compile-budget, compile-budget-workflow ]
    # Not always(): that runs on cancellation too, so a push superseding an
    # in-flight run leaves this red on the head it just replaced. !cancelled()
    # still runs when a leg fails, which is the whole job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every leg succeeded
        env:
          ACTIONLINT: ${{ needs.actionlint.result }}
          CODEQL: ${{ needs.codeql.result }}
          INSTALL_GCC: ${{ needs.install-gcc.result }}
          SETUP_TOOLCHAIN: ${{ needs.setup-toolchain.result }}
          STD_TEST_SUITE: ${{ needs.std-test-suite.result }}
          LAYERING: ${{ needs.layering.result }}
          CI_LOCAL: ${{ needs.ci-local.result }}
          SANITIZER_LEGS: ${{ needs.sanitizer-legs.result }}
          GCOVR: ${{ needs.gcovr.result }}
          COVERAGE: ${{ needs.coverage.result }}
          CONFIG_DRIFT: ${{ needs.config-drift.result }}
          COMPILE_BUDGET: ${{ needs.compile-budget.result }}
          COMPILE_BUDGET_WORKFLOW: ${{ needs.compile-budget-workflow.result }}
        run: |
          set -euo pipefail
          echo "actionlint: $ACTIONLINT"
          echo "codeql:     $CODEQL"
          echo "install-gcc: $INSTALL_GCC"
          echo "setup-toolchain: $SETUP_TOOLCHAIN"
          echo "std-test-suite: $STD_TEST_SUITE"
          echo "layering: $LAYERING"
          echo "ci-local: $CI_LOCAL"
          echo "sanitizer-legs: $SANITIZER_LEGS"
          echo "gcovr: $GCOVR"
          echo "coverage: $COVERAGE"
          echo "config-drift: $CONFIG_DRIFT"
          echo "compile-budget: $COMPILE_BUDGET"
          echo "compile-budget-workflow: $COMPILE_BUDGET_WORKFLOW"
          # Only success passes. A skipped leg is a leg that did not run, which
          # is exactly what this is here to catch.
          test "$ACTIONLINT" = success
          test "$CODEQL" = success
          test "$INSTALL_GCC" = success
          test "$SETUP_TOOLCHAIN" = success
          test "$STD_TEST_SUITE" = success
          test "$LAYERING" = success
          test "$CI_LOCAL" = success
          test "$SANITIZER_LEGS" = success
          test "$GCOVR" = success
          test "$COVERAGE" = success
          test "$CONFIG_DRIFT" = success
          test "$COMPILE_BUDGET" = success
          test "$COMPILE_BUDGET_WORKFLOW" = success
