name: Coverage

# id-token for Codecov, which uploads over OIDC rather than with a token, so
# there is no secret for a caller to pass. A called workflow cannot exceed its
# caller's permissions, so the stub has to grant this too.
permissions:
  contents: read
  id-token: write

# No concurrency group; see gcc.yml. It belongs to the calling stub.

on:
  workflow_call:
    inputs:
      gcc_tier:
        description: Rung supplying the compiler and its matching gcov.
        type: string
        required: false
        default: stable
      vcpkg_triplet:
        description: Triplet for the test dependencies.
        type: string
        required: false
        default: x64-linux
      vcpkg_features:
        description: >
          Comma-separated manifest features to install, for a manifest that
          keeps its test-only dependencies out of default-features. Additive:
          the default features install either way.
        type: string
        required: false
        default: ""
      exclude:
        description: >
          Space-separated gcovr --exclude patterns. The default keeps the
          report to the library's own headers.
        type: string
        required: false
        default: "test/.* build/.*"
      fail_under_line:
        description: Line coverage below which the job fails.
        type: number
        required: false
        default: 100
      fail_under_branch:
        description: Branch coverage below which the job fails.
        type: number
        required: false
        default: 100
      scan_for_modules:
        description: >
          Whether CMake scans every C++20 translation unit for the modules it
          imports, as CMAKE_CXX_SCAN_FOR_MODULES. Off by default: a project
          importing none pays a preprocessor pass per translation unit for it,
          and keeps a fully preprocessed copy of each in the build tree --
          about 5 MB a unit, 740 MB for one library's 153. Passed ahead of
          cmake_args, so a -D there still wins.
        type: boolean
        required: false
        default: false
      debug_flags:
        description: >
          CMAKE_CXX_FLAGS_DEBUG, in place of CMake's own -g. -g1 keeps the
          line tables and function names a symbolized backtrace reads and
          drops the variable and type information that is most of an
          object's size and of the link's work. Empty passes nothing, so
          CMake's default applies. Passed ahead of cmake_args, so a -D there
          still wins.
        type: string
        required: false
        default: "-g1"
      cmake_args:
        description: Extra -D arguments for the configure step.
        type: string
        required: false
        default: ""
      generator:
        description: >
          CMake generator for the configure step. Ninja is what the runner
          images carry and what C++20 modules require; a caller needing the
          platform default names it here.
        type: string
        required: false
        default: Ninja

jobs:
  coverage:
    name: gcovr
    runs-on: ubuntu-24.04
    env:
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_CACHE_KEY: vcpkg-coverage-

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: rhalbersma/cpp-ci/.github/actions/apt-retry@b5161ff82d9d4cb1a123ed37c8b0b5295ce8044b

      - name: Resolve the toolchain on this rung
        id: toolchain
        uses: rhalbersma/cpp-ci/.github/actions/toolchain@b5161ff82d9d4cb1a123ed37c8b0b5295ce8044b
        with:
          toolchain: gcc
          tier: ${{ inputs.gcc_tier }}

      - name: Require the rung to be filled
        if: steps.toolchain.outputs.supported != 'true'
        env:
          TIER: ${{ inputs.gcc_tier }}
        run: |
          echo "::error::gcc has no $TIER rung"
          exit 1

      - name: Install GCC
        uses: rhalbersma/cpp-ci/.github/actions/install-gcc@b5161ff82d9d4cb1a123ed37c8b0b5295ce8044b
        with:
          version: ${{ steps.toolchain.outputs.version }}
          trunk: ${{ steps.toolchain.outputs.trunk }}

      - name: Install gcovr
        uses: rhalbersma/cpp-ci/.github/actions/install-gcovr@b5161ff82d9d4cb1a123ed37c8b0b5295ce8044b

      - name: Name the toolchain
        env:
          VERSION: ${{ steps.toolchain.outputs.version }}
        run: |
          set -euo pipefail
          echo "TOOLCHAIN_CC=gcc-${VERSION}"    >> "$GITHUB_ENV"
          echo "TOOLCHAIN_CXX=g++-${VERSION}"   >> "$GITHUB_ENV"
          # gcov has to match the compiler that wrote the notes.
          echo "TOOLCHAIN_GCOV=gcov-${VERSION}" >> "$GITHUB_ENV"

      - name: Report toolchain versions
        run: |
          "$TOOLCHAIN_CC" --version
          "$TOOLCHAIN_CXX" --version
          "$TOOLCHAIN_GCOV" --version
          gcovr --version
          cmake --version

      # vcpkg's own x-gha backend was removed, so cache its binary packages
      # with actions/cache; the archives are named by ABI hash.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: ${{ env.VCPKG_CACHE_KEY }}

      - name: Install the test dependencies
        uses: rhalbersma/cpp-ci/.github/actions/vcpkg-install@b5161ff82d9d4cb1a123ed37c8b0b5295ce8044b
        with:
          triplet: ${{ inputs.vcpkg_triplet }}
          features: ${{ inputs.vcpkg_features }}

      # Keyed on the archives' contents: an unconditional save would add an
      # entry per run and evict this repo's other caches.
      - name: Save vcpkg binary cache
        if: >-
          hashFiles('vcpkg-cache/**') != '' &&
          steps.vcpkg-cache.outputs.cache-matched-key !=
          format('{0}{1}', env.VCPKG_CACHE_KEY, hashFiles('vcpkg-cache/**'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}${{ hashFiles('vcpkg-cache/**') }}

      - name: Configure
        shell: bash
        env:
          TRIPLET: ${{ inputs.vcpkg_triplet }}
          EXTRA_CMAKE: ${{ inputs.cmake_args }}
          SCAN_FOR_MODULES: ${{ inputs.scan_for_modules && 'ON' || 'OFF' }}
          DEBUG_FLAGS: ${{ inputs.debug_flags }}
          GENERATOR: ${{ inputs.generator }}
          FEATURES: ${{ inputs.vcpkg_features }}
        run: |
          set -euo pipefail
          read -ra extra <<< "$EXTRA_CMAKE"
          # A CMake list, so the separator is a semicolon rather than a
          # comma. Left empty when the caller named no feature, so the
          # configure line stays the one it has always been.
          features_arg=""
          if [ -n "$FEATURES" ]; then
            features_arg="-DVCPKG_MANIFEST_FEATURES=$(printf '%s' "$FEATURES" | tr -d '[:space:]' | tr ',' ';' | tr -s ';' | sed 's/^;//; s/;$//')"
          fi
          # The module scan and the Debug flags go ahead of cmake_args, so a
          # caller's own -D for either comes later and wins. An empty
          # debug_flags contributes no argument, leaving CMake's own -g.
          #
          # No -g of its own in CMAKE_CXX_FLAGS: gcov reads the .gcno and
          # .gcda files --coverage writes, not DWARF, so the debug level is
          # debug_flags' alone to set, and a -g here would only be overridden
          # by the -g1 that follows it.
          cmake -S . -B build \
            -G "$GENERATOR" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER="$TOOLCHAIN_CC" \
            -DCMAKE_CXX_COMPILER="$TOOLCHAIN_CXX" \
            -DCMAKE_CXX_FLAGS="--coverage -O0" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$TRIPLET" \
            ${features_arg:+"$features_arg"} \
            -DCMAKE_CXX_SCAN_FOR_MODULES="$SCAN_FOR_MODULES" \
            ${DEBUG_FLAGS:+"-DCMAKE_CXX_FLAGS_DEBUG=$DEBUG_FLAGS"} \
            "${extra[@]}"

      - name: Build
        run: cmake --build build -v

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Full coverage of the library's own headers, less assert(...) and
      # "= default;", and less the branches gcov synthesizes that no test can
      # take.
      #
      # A line holding nothing but a closing brace is excluded for the same
      # reason. It carries no code of the author's: what gcov records there is
      # the unwind resume for a function with a local to destroy, reachable
      # only if something inside throws. A test suite that passes never runs
      # it, so every such function reads one line short of covered. Nothing
      # hides behind the exclusion either - a function that is never called
      # still has every line of its body counted.
      #
      # --merge-lines because the question this gate asks is whether a line of
      # a template is ever run, not whether every emitted copy of it is. Without
      # it gcov's records stay per instantiation and per translation unit, so a
      # header line reads as uncovered in a unit that instantiates it and takes
      # another route - which the same line, run in the unit next door, does not
      # redeem. That is not a gap in the tests, and closing it means re-running
      # identical code once per caller.
      - name: Generate coverage report
        env:
          EXCLUDE: ${{ inputs.exclude }}
          FAIL_UNDER_LINE: ${{ inputs.fail_under_line }}
          FAIL_UNDER_BRANCH: ${{ inputs.fail_under_branch }}
        run: |
          set -euo pipefail
          # read -ra, not an unquoted expansion: a bare "for p in $EXCLUDE"
          # splits AND globs, and "test/.*" then matches test/.clang-tidy and
          # stops being a regex, leaving the test tree in the report.
          read -ra patterns <<< "$EXCLUDE"
          excludes=()
          for pattern in "${patterns[@]}"; do
            excludes+=(--exclude "$pattern")
          done
          gcovr --root . \
            --gcov-executable "$TOOLCHAIN_GCOV" \
            --merge-lines \
            "${excludes[@]}" \
            --exclude-lines-by-pattern '^\s*assert\(' \
            --exclude-lines-by-pattern '=\s*default;' \
            --exclude-lines-by-pattern '\s*\}\s*$' \
            --exclude-branches-by-pattern '^\s*assert\(' \
            --exclude-branches-by-pattern '^\s*.*=\s*default;' \
            --exclude-throw-branches \
            --exclude-unreachable-branches \
            --print-summary \
            --fail-under-line "$FAIL_UNDER_LINE" \
            --fail-under-branch "$FAIL_UNDER_BRANCH" \
            --txt build/coverage.txt \
            --xml-pretty --xml build/coverage.xml

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '### Line coverage (gcovr)'
            echo '```'
            cat build/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Without these the CLI's own gcov plugin blends an unfiltered second
      # pass in alongside coverage.xml, undoing the exclusions above.
      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: build/coverage.xml
          plugins: noop
          disable_search: true
          use_oidc: true
          # Fail loudly on a rejected upload rather than leaving a green job
          # with no coverage; a later drop is what the daily run is for.
          fail_ci_if_error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-xml
          path: build/coverage.xml
