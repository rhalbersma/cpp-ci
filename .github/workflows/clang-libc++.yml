name: Clang libc++

permissions:
  contents: read

# No concurrency group here; see gcc.yml. It belongs to the calling stub.

on:
  workflow_call:
    inputs:
      tiers:
        description: Comma-separated rungs to build. Absent rungs are dropped.
        type: string
        required: false
        default: stable,qualification,development
      build_types:
        description: Comma-separated CMake build types.
        type: string
        required: false
        default: Release,Debug
      reduce_on_pr:
        description: >
          Whether a pull request runs the floor and ceiling in Debug alone.
          False by default, as in sanitizers.yml. A caller makes the "all"
          gate its required check, and that gate covers only the legs that
          ran: reduced, it reports success on a pull request that never
          compiled the middle rung, so a break there merges green and reddens
          main on the push behind it. Pass true where something else genuinely
          covers that rung.
        type: boolean
        required: false
        default: false
      vcpkg_triplet:
        description: Overlay triplet building the dependencies with Clang and libc++.
        type: string
        required: false
        default: x64-linux-libcxx
      cxx_flags:
        description: Extra flags for the caller.
        type: string
        required: false
        default: ""
      cmake_args:
        description: Extra -D arguments for the configure step.
        type: string
        required: false
        default: ""

jobs:
  ladder:
    name: Resolve the ladder
    runs-on: ubuntu-24.04
    outputs:
      legs: ${{ steps.ladder.outputs.matrix }}
    steps:
      - id: ladder
        uses: rhalbersma/cpp-ci/.github/actions/toolchain@e2886b13f6fcd1eceb231652f816b016de41be1d
        with:
          mode: matrix
          toolchain: clang
          tiers: ${{ inputs.tiers }}
          build_types: ${{ inputs.build_types }}
          reduce_on_pr: ${{ inputs.reduce_on_pr }}

  build:
    name: ${{ matrix.label }} ${{ matrix.build_type }}
    needs: ladder
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ladder.outputs.legs) }}
    env:
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      # Read again by the vcpkg CMake integration, so the compiler selection
      # has to outlive the install step.
      VCPKG_CLANG_VERSION: ${{ matrix.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: rhalbersma/cpp-ci/.github/actions/apt-retry@e2886b13f6fcd1eceb231652f816b016de41be1d

      # No paired libstdc++: libc++ replaces it, which is the point of this
      # workflow, and the ladder's gcc_version applies to the other one.
      - name: Install Clang and libc++
        uses: rhalbersma/cpp-ci/.github/actions/install-clang@e2886b13f6fcd1eceb231652f816b016de41be1d
        with:
          version: ${{ matrix.version }}
          llvm_suffix: ${{ matrix.llvm_suffix }}
          libcxx: "true"

      - name: Locate the overlay triplets
        id: overlay
        uses: rhalbersma/cpp-ci/.github/actions/vcpkg-overlay@e2886b13f6fcd1eceb231652f816b016de41be1d

      - name: Name the toolchain and its cache
        env:
          VERSION: ${{ matrix.version }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          echo "TOOLCHAIN_CC=clang-${VERSION}"    >> "$GITHUB_ENV"
          echo "TOOLCHAIN_CXX=clang++-${VERSION}" >> "$GITHUB_ENV"
          echo "VCPKG_CACHE_KEY=vcpkg-clang-libcxx-${LABEL}-" >> "$GITHUB_ENV"

      - name: Report toolchain versions
        run: |
          "$TOOLCHAIN_CC" --version
          "$TOOLCHAIN_CXX" --version
          dpkg-query -W -f='${Package} ${Version}\n' \
            "libc++-${VCPKG_CLANG_VERSION}-dev" "libc++abi-${VCPKG_CLANG_VERSION}-dev"
          cmake --version

      # vcpkg's own x-gha backend was removed, so cache its binary packages
      # with actions/cache; the archives are named by ABI hash.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: ${{ env.VCPKG_CACHE_KEY }}

      - name: Install the test dependencies
        uses: rhalbersma/cpp-ci/.github/actions/vcpkg-install@e2886b13f6fcd1eceb231652f816b016de41be1d
        with:
          triplet: ${{ inputs.vcpkg_triplet }}
          overlay_triplets: ${{ steps.overlay.outputs.triplets }}

      # Keyed on the archives' contents: an unconditional save would add an
      # entry per run and evict this repo's other caches.
      - name: Save vcpkg binary cache
        if: >-
          hashFiles('vcpkg-cache/**') != '' &&
          steps.vcpkg-cache.outputs.cache-matched-key !=
          format('{0}{1}', env.VCPKG_CACHE_KEY, hashFiles('vcpkg-cache/**'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}${{ hashFiles('vcpkg-cache/**') }}

      - name: Configure
        shell: bash
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          CXX_FLAGS: ${{ inputs.cxx_flags }}
          TRIPLET: ${{ inputs.vcpkg_triplet }}
          OVERLAY_TRIPLETS: ${{ steps.overlay.outputs.triplets }}
          EXTRA_CMAKE: ${{ inputs.cmake_args }}
        run: |
          set -euo pipefail
          read -ra extra <<< "$EXTRA_CMAKE"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_C_COMPILER="$TOOLCHAIN_CC" \
            -DCMAKE_CXX_COMPILER="$TOOLCHAIN_CXX" \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ $CXX_FLAGS" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$TRIPLET" \
            -DVCPKG_OVERLAY_TRIPLETS="$OVERLAY_TRIPLETS" \
            "${extra[@]}"

      - name: Build
        run: cmake --build build -v

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # One check name that does not move, for branch protection to require.
  #
  # The legs are named for compiler versions -- "15 Debug", "24-SVN Debug" --
  # and the tier ladder slides those forward by design: the day GCC 16 becomes
  # stable, "15 Debug" stops existing and a required check naming it waits
  # forever. The reduction on pull requests moves them too, so the names a
  # pull request reports are not even the names a push reports.
  #
  # This job's name does not depend on the matrix, so a caller requires
  # "<its job id> / all" once and never revisits it. always() so it runs when
  # a leg failed rather than being skipped with it -- which is the whole point.
  all:
    name: all
    needs: build
    # Not always(): that runs on cancellation too, so a push superseding an
    # in-flight run left this red on the head it had just replaced -- and
    # started a runner to do it, after the run was already cancelled. Three
    # gates reported failure that way within a minute of being added, on
    # workflows whose legs had passed every step.
    #
    # !cancelled() still runs when a leg fails, which is the whole job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every leg succeeded
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          echo "legs: $RESULT"
          # Only success passes. A skipped matrix means the ladder job failed
          # or emitted nothing, which is a red run, not an absent one.
          test "$RESULT" = success
