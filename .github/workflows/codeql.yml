name: CodeQL

permissions:
  contents: read

# No concurrency group; see gcc.yml. It belongs to the calling stub.

on:
  workflow_call:
    inputs:
      gcc_tier:
        description: >
          Rung supplying the compiler. The extractor runs front-end side, so
          this is the standard library the analysis sees.
        type: string
        required: false
        default: stable
      languages:
        description: CodeQL languages to analyse.
        type: string
        required: false
        default: c-cpp
      queries:
        description: CodeQL query suite.
        type: string
        required: false
        default: security-extended
      vcpkg_triplet:
        description: Triplet for the test dependencies.
        type: string
        required: false
        default: x64-linux
      cmake_args:
        description: Extra -D arguments for the configure step.
        type: string
        required: false
        default: ""

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04

    # security-events to file the findings. A called workflow cannot exceed its
    # caller's permissions, so a stub has to grant this too, on its calling job.
    #
    # Deliberately here rather than at workflow level. Scorecard's
    # Token-Permissions check subtracts a full point for a top-level
    # security-events write and nothing for the same grant on a job, provided
    # the workflow still declares a top-level block at all -- which the
    # contents: read above does. Least privilege reads the same way: only this
    # job files findings.
    permissions:
      contents: read
      security-events: write

    env:
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_CACHE_KEY: vcpkg-codeql-

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: rhalbersma/cpp-ci/.github/actions/apt-retry@676e6fb7abc784e54a227998bf3e9c39790e63cf

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ inputs.languages }}
          queries: ${{ inputs.queries }}

      - name: Resolve the toolchain on this rung
        id: toolchain
        uses: rhalbersma/cpp-ci/.github/actions/toolchain@676e6fb7abc784e54a227998bf3e9c39790e63cf
        with:
          toolchain: gcc
          tier: ${{ inputs.gcc_tier }}

      - name: Require the rung to be filled
        if: steps.toolchain.outputs.supported != 'true'
        env:
          TIER: ${{ inputs.gcc_tier }}
        run: |
          echo "::error::gcc has no $TIER rung"
          exit 1

      # The image's default GCC is older than these libraries need; the
      # extractor reads whatever standard library the build does.
      - name: Install GCC
        uses: rhalbersma/cpp-ci/.github/actions/install-gcc@676e6fb7abc784e54a227998bf3e9c39790e63cf
        with:
          version: ${{ steps.toolchain.outputs.version }}
          trunk: ${{ steps.toolchain.outputs.trunk }}

      - name: Name the toolchain
        env:
          VERSION: ${{ steps.toolchain.outputs.version }}
        run: |
          set -euo pipefail
          echo "TOOLCHAIN_CC=gcc-${VERSION}"  >> "$GITHUB_ENV"
          echo "TOOLCHAIN_CXX=g++-${VERSION}" >> "$GITHUB_ENV"

      # vcpkg's own x-gha backend was removed, so cache its binary packages
      # with actions/cache; the archives are named by ABI hash.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: ${{ env.VCPKG_CACHE_KEY }}

      - name: Install the test dependencies
        uses: rhalbersma/cpp-ci/.github/actions/vcpkg-install@676e6fb7abc784e54a227998bf3e9c39790e63cf
        with:
          triplet: ${{ inputs.vcpkg_triplet }}

      # Keyed on the archives' contents: an unconditional save would add an
      # entry per run and evict this repo's other caches.
      - name: Save vcpkg binary cache
        if: >-
          hashFiles('vcpkg-cache/**') != '' &&
          steps.vcpkg-cache.outputs.cache-matched-key !=
          format('{0}{1}', env.VCPKG_CACHE_KEY, hashFiles('vcpkg-cache/**'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}${{ hashFiles('vcpkg-cache/**') }}

      # Debug rather than unset, so NDEBUG stays undefined on purpose: -DNDEBUG
      # rewrites every assert before the extractor, which runs front-end side.
      #
      # VCPKG_INSTALLED_DIR is moved out of the build tree, which is the one
      # thing here that is about the analysis rather than the build. Manifest
      # mode installs into <build>/vcpkg_installed by default, and that sits
      # inside the checkout -- which is CodeQL's source root, and the rule for
      # what gets reported. So every dependency header the extractor sees
      # becomes a candidate, and Boost.Test duly filed one against the caller:
      # an unterminated variadic call in report_assertion, real enough in its
      # own terms and not the caller's to fix. libstdc++ files nothing for the
      # same reason this now files nothing -- /usr/include is not under the
      # root either.
      #
      # paths-ignore does not reach this. It applies to interpreted languages
      # and to compiled ones analysed without building; this leg builds, and
      # for a built analysis the exclusion has to come from the build itself.
      #
      # sanitizers.yml made the same call for the same dependency: instrument
      # the code under test and nothing else, or the leg reports only on
      # libraries the caller does not own.
      - name: Configure
        shell: bash
        env:
          TRIPLET: ${{ inputs.vcpkg_triplet }}
          EXTRA_CMAKE: ${{ inputs.cmake_args }}
        run: |
          set -euo pipefail
          read -ra extra <<< "$EXTRA_CMAKE"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER="$TOOLCHAIN_CC" \
            -DCMAKE_CXX_COMPILER="$TOOLCHAIN_CXX" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$TRIPLET" \
            -DVCPKG_INSTALLED_DIR="$RUNNER_TEMP/vcpkg_installed" \
            "${extra[@]}"

      - name: Build
        run: cmake --build build -v

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:${{ inputs.languages }}"
