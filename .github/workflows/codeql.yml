name: CodeQL

permissions:
  contents: read

# No concurrency group at workflow level; see gcc.yml. It belongs to the calling
# stub, and a group declared here would evaluate to the caller's own string --
# github.workflow and github.ref both name the CALLER inside a called workflow.
# The self-analysis job below carries its own group instead, so nothing a caller
# reaches is affected.

# This repository ships no C++ at all: 14 workflows, 9 composite actions and one
# Python script. What it does ship is the thing CodeQL's actions pack exists to
# read, and it is a dependency of four repositories, so a script injection or an
# untrusted checkout here propagates outward. codeql.yml was workflow_call only,
# which meant it analysed every repository that called it and never the one it
# lives in -- the same gap scorecard.yml closed for itself.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      gcc_tier:
        description: >
          Rung supplying the compiler. The extractor runs front-end side, so
          this is the standard library the analysis sees.
        type: string
        required: false
        default: stable
      languages:
        description: CodeQL languages to analyse.
        type: string
        required: false
        default: c-cpp
      queries:
        description: CodeQL query suite.
        type: string
        required: false
        default: security-extended
      vcpkg_triplet:
        description: Triplet for the test dependencies.
        type: string
        required: false
        default: x64-linux
      cmake_args:
        description: Extra -D arguments for the configure step.
        type: string
        required: false
        default: ""

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04

    # Callers only. There is no C++ here to extract, so this job would fail on
    # the push, schedule and dispatch runs added above.
    #
    # The test is whether this run has inputs at all. github.event_name cannot
    # do it: inside a called workflow it is the CALLER's event, never
    # "workflow_call", so naming the event would skip this for every caller.
    # github.repository is the caller's too, so a name comparison would work
    # here but break in a fork, where a push would pass the test and then fail
    # for want of any C++. The inputs context is empty on push, schedule and
    # workflow_dispatch and carries this workflow's defaults on workflow_call,
    # which separates the two roles exactly and in any repository.
    if: format('{0}', inputs.languages) != ''


    # security-events to file the findings. A called workflow cannot exceed its
    # caller's permissions, so a stub has to grant this too, on its calling job.
    #
    # Deliberately here rather than at workflow level. Scorecard's
    # Token-Permissions check subtracts a full point for a top-level
    # security-events write and nothing for the same grant on a job, provided
    # the workflow still declares a top-level block at all -- which the
    # contents: read above does. Least privilege reads the same way: only this
    # job files findings.
    permissions:
      contents: read
      security-events: write

    env:
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_CACHE_KEY: vcpkg-codeql-

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: rhalbersma/cpp-ci/.github/actions/apt-retry@0061e0a7dcc5197821232597043379f5a09cbff9

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ inputs.languages }}
          queries: ${{ inputs.queries }}

      - name: Resolve the toolchain on this rung
        id: toolchain
        uses: rhalbersma/cpp-ci/.github/actions/toolchain@0061e0a7dcc5197821232597043379f5a09cbff9
        with:
          toolchain: gcc
          tier: ${{ inputs.gcc_tier }}

      - name: Require the rung to be filled
        if: steps.toolchain.outputs.supported != 'true'
        env:
          TIER: ${{ inputs.gcc_tier }}
        run: |
          echo "::error::gcc has no $TIER rung"
          exit 1

      # The image's default GCC is older than these libraries need; the
      # extractor reads whatever standard library the build does.
      - name: Install GCC
        uses: rhalbersma/cpp-ci/.github/actions/install-gcc@0061e0a7dcc5197821232597043379f5a09cbff9
        with:
          version: ${{ steps.toolchain.outputs.version }}
          trunk: ${{ steps.toolchain.outputs.trunk }}

      - name: Name the toolchain
        env:
          VERSION: ${{ steps.toolchain.outputs.version }}
        run: |
          set -euo pipefail
          echo "TOOLCHAIN_CC=gcc-${VERSION}"  >> "$GITHUB_ENV"
          echo "TOOLCHAIN_CXX=g++-${VERSION}" >> "$GITHUB_ENV"

      # vcpkg's own x-gha backend was removed, so cache its binary packages
      # with actions/cache; the archives are named by ABI hash.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: ${{ env.VCPKG_CACHE_KEY }}

      - name: Install the test dependencies
        uses: rhalbersma/cpp-ci/.github/actions/vcpkg-install@0061e0a7dcc5197821232597043379f5a09cbff9
        with:
          triplet: ${{ inputs.vcpkg_triplet }}

      # Keyed on the archives' contents: an unconditional save would add an
      # entry per run and evict this repo's other caches.
      - name: Save vcpkg binary cache
        if: >-
          hashFiles('vcpkg-cache/**') != '' &&
          steps.vcpkg-cache.outputs.cache-matched-key !=
          format('{0}{1}', env.VCPKG_CACHE_KEY, hashFiles('vcpkg-cache/**'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}${{ hashFiles('vcpkg-cache/**') }}

      # Debug rather than unset, so NDEBUG stays undefined on purpose: -DNDEBUG
      # rewrites every assert before the extractor, which runs front-end side.
      - name: Configure
        shell: bash
        env:
          TRIPLET: ${{ inputs.vcpkg_triplet }}
          EXTRA_CMAKE: ${{ inputs.cmake_args }}
        run: |
          set -euo pipefail
          read -ra extra <<< "$EXTRA_CMAKE"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER="$TOOLCHAIN_CC" \
            -DCMAKE_CXX_COMPILER="$TOOLCHAIN_CXX" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$TRIPLET" \
            "${extra[@]}"

      - name: Build
        run: cmake --build build -v

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ inputs.languages }}"

  # This repository analysing itself. Separate from the job above rather than
  # folded into it: that one is a C++ pipeline - resolve a rung, install GCC,
  # install vcpkg dependencies, configure, build - and none of it applies to a
  # build-mode: none extraction. Gating those seven steps on a language would
  # also have to survive the empty-inputs trap on every one of them, on the
  # workflow all four callers reach. This shares only checkout and the CodeQL
  # actions, and no caller reaches it.
  analyze-self:
    name: Analyze this repository
    runs-on: ubuntu-24.04

    # The other half of the test above, so exactly one of the two jobs runs.
    # A fork gets its own analysis rather than nothing.
    if: format('{0}', inputs.languages) == ''

    # Job level, so a caller's run never reaches it. github.workflow and
    # github.ref would name the caller inside a called workflow; the trailing
    # literal keeps this group distinct even so.
    #
    # The language belongs in the key. Without it both matrix legs derive the
    # same string, and cancel-in-progress then makes them cancel each other:
    # the first run of this job killed its own actions leg in the second it
    # started, leaving only python. A group is per language so that a new push
    # supersedes the previous run's leg for that language and nothing else.
    concurrency:
      group: >-
        ${{ github.workflow }}-${{ github.ref }}-cpp-ci-codeql-self-${{ matrix.language }}
      cancel-in-progress: true

    # security-events to file the findings, actions to let the extractor read
    # the workflows it is analysing. Job level for the same reason as above.
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        # actions reads the workflows and composite actions; python reads
        # check_internal_pins.py. Neither needs a compiler, so both run with
        # build-mode: none and the analysis is the whole job.
        language: [ actions, python ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
