name: Sanitizers

permissions:
  contents: read

# No concurrency group; see gcc.yml. It belongs to the calling stub.

on:
  workflow_call:
    inputs:
      gcc_tiers:
        description: Comma-separated rungs for the legs GCC runs.
        type: string
        required: false
        default: stable,qualification,development
      clang_tiers:
        description: Comma-separated rungs for the legs Clang runs.
        type: string
        required: false
        default: stable,qualification,development
      libcxx_tiers:
        description: >
          Comma-separated rungs for the ASan leg that swaps in libc++, which
          is otherwise the Clang ladder. Its own input because a library can
          be perfectly sound and still not build against libc++ at all -- a
          missing C++23 range adaptor is enough -- and that is a fact about
          the standard library, not about the sanitizer. Left in the Clang
          ladder, one such library reddens this workflow's gate permanently,
          which is worse than not running the leg: a gate that is always red
          reports nothing about the legs that were meant to be green. Empty
          drops the leg entirely, for exactly that case.
        type: string
        required: false
        default: stable,qualification,development
      reduce_on_pr:
        description: >
          Whether a pull request runs the floor and ceiling alone. False, as
          it is everywhere here now -- this workflow simply got there first,
          and for a second reason of its own. The general one is that the
          gate a caller marks required covers only the legs that ran. The
          particular one is that what a sanitizer reports depends on what its
          release instruments, which moves rung by rung, so the qualification
          rung is not covered by testing either side of it: skipping it would
          leave exactly the gap this workflow found twice in one morning at
          the ends.
        type: boolean
        required: false
        default: false
      vcpkg_gcc_triplet:
        description: >
          Overlay triplet for the GCC legs. Like every other workflow here,
          the dependencies are built with the compiler under test rather than
          the runner's default: a trunk snapshot ships its own libstdc++, and
          a Boost.Test built against the runner's breaks at runtime.
        type: string
        required: false
        default: x64-linux-gcc
      vcpkg_clang_triplet:
        description: Overlay triplet for the Clang legs that keep libstdc++.
        type: string
        required: false
        default: x64-linux-clang
      vcpkg_libcxx_triplet:
        description: >
          Overlay triplet for the libc++ leg. Boost.Test has to be built
          against libc++ as well: ASan's container-overflow checking reads
          annotations the standard library emits, and a Boost.Test built
          against libstdc++ would not link with it in any case.
        type: string
        required: false
        default: x64-linux-libcxx
      cxx_flags:
        description: Flags appended after the sanitizer's own, for the caller.
        type: string
        required: false
        default: ""
      cmake_args:
        description: Extra -D arguments for the configure step.
        type: string
        required: false
        default: ""

jobs:
  # The legs are crossed with the ladder here rather than written out: a
  # sanitizer's instrumentation is not fixed across releases any more than it
  # is across compilers. GCC's UBSan does not diagnose the signed overflow
  # Clang's does on a _BitInt(2), and a bit-precise library has no reason to
  # assume one GCC agrees with the next about that either.
  ladder:
    name: Resolve the ladder
    runs-on: ubuntu-24.04
    outputs:
      legs: ${{ steps.cross.outputs.matrix }}
    steps:
      - id: gcc
        uses: rhalbersma/cpp-ci/.github/actions/toolchain@df5060f4251a3e20c0860661c4ca761f905392a3
        with:
          mode: matrix
          toolchain: gcc
          tiers: ${{ inputs.gcc_tiers }}
          build_types: Debug
          reduce_on_pr: ${{ inputs.reduce_on_pr }}

      - id: clang
        uses: rhalbersma/cpp-ci/.github/actions/toolchain@df5060f4251a3e20c0860661c4ca761f905392a3
        with:
          mode: matrix
          toolchain: clang
          tiers: ${{ inputs.clang_tiers }}
          build_types: Debug
          reduce_on_pr: ${{ inputs.reduce_on_pr }}

      # Skipped, not called with an empty list: the action errors on tiers it
      # cannot fill, which is the right answer for a caller that named a rung
      # and a deliberate no-op for a caller that named none.
      - id: libcxx
        if: inputs.libcxx_tiers != ''
        uses: rhalbersma/cpp-ci/.github/actions/toolchain@df5060f4251a3e20c0860661c4ca761f905392a3
        with:
          mode: matrix
          toolchain: clang
          tiers: ${{ inputs.libcxx_tiers }}
          build_types: Debug
          reduce_on_pr: ${{ inputs.reduce_on_pr }}

      - id: cross
        shell: bash
        env:
          GCC_RUNGS: ${{ steps.gcc.outputs.matrix }}
          CLANG_RUNGS: ${{ steps.clang.outputs.matrix }}
          LIBCXX_RUNGS: ${{ steps.libcxx.outputs.matrix }}
        run: |
          set -euo pipefail

          # A skipped step has no outputs, so the empty case arrives as the
          # empty string rather than as JSON. No rungs means the libc++ leg
          # crosses with nothing and drops out below.
          libcxx_rungs="${LIBCXX_RUNGS:-}"
          if [ -z "$libcxx_rungs" ]; then
            libcxx_rungs='{"include":[]}'
            echo "::notice::libcxx_tiers is empty, dropping the ASan libc++ leg"
          fi

          # Leak detection deliberately left on. A library that allocates
          # nothing has nothing to report, and the repositories that do
          # allocate are the ones that leg exists for.
          #
          # ASan runs against both standard libraries. Its detection is a
          # shared runtime, so a second compiler alone would re-run one check
          # -- but the container-overflow annotations are not shared: libc++
          # instruments vector, string and deque, libstdc++ annotates vector
          # alone and only under _GLIBCXX_SANITIZE_VECTOR.
          #
          # UBSan twice over, because the two implementations do not check the
          # same set and a clean run under one says nothing about the other.
          #
          # implicit-conversion is Clang's alone -- g++ rejects the group --
          # and catches the value-dependent truncations and sign changes that
          # -Wconversion can only diagnose where it proves them statically.
          legs='[
            {"id":"asan","name":"ASan + LSan","compiler":"GCC","family":"gcc",
             "flags":"-fsanitize=address -fno-omit-frame-pointer -g",
             "options":"ASAN_OPTIONS=detect_leaks=1"},
            {"id":"asan-libcxx","name":"ASan + LSan","compiler":"Clang libc++","family":"clang","libcxx":true,
             "flags":"-fsanitize=address -fno-omit-frame-pointer -g -stdlib=libc++",
             "options":"ASAN_OPTIONS=detect_leaks=1"},
            {"id":"ubsan-gcc","name":"UBSan","compiler":"GCC","family":"gcc",
             "flags":"-fsanitize=undefined -fno-sanitize-recover=undefined -g",
             "options":"UBSAN_OPTIONS=print_stacktrace=1"},
            {"id":"ubsan-clang","name":"UBSan","compiler":"Clang","family":"clang",
             "flags":"-fsanitize=undefined -fno-sanitize-recover=undefined -g",
             "options":"UBSAN_OPTIONS=print_stacktrace=1"},
            {"id":"implicit-conversion","name":"Implicit conversion","compiler":"Clang","family":"clang",
             "ignore_foreign_code":true,
             "flags":"-fsanitize=implicit-conversion -fno-sanitize-recover=implicit-conversion -g",
             "options":"UBSAN_OPTIONS=print_stacktrace=1"}
          ]'

          matrix=$(jq -c -n \
            --argjson legs "$legs" \
            --argjson gcc "$GCC_RUNGS" \
            --argjson clang "$CLANG_RUNGS" \
            --argjson libcxx "$libcxx_rungs" \
            '{include: [ $legs[] as $leg
               | (if $leg.family == "gcc" then $gcc
                  elif $leg.libcxx then $libcxx
                  else $clang end).include[] as $rung
               | $leg + $rung ]}')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq -r '.include | "\(length) legs:", (.[] | "  \(.name) / \(.compiler) \(.label)")' <<< "$matrix"

  build:
    name: ${{ matrix.name }} / ${{ matrix.compiler }} ${{ matrix.label }}
    needs: ladder
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ladder.outputs.legs) }}
    env:
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This repository's own actions by owner/repo@sha, not by ./ path: a
      # relative reference resolves against the caller's workspace, which
      # holds the caller's checkout and none of this. The pin keeps a caller's
      # pinned workflow from silently pulling actions off a moving main.
      - uses: rhalbersma/cpp-ci/.github/actions/apt-retry@df5060f4251a3e20c0860661c4ca761f905392a3

      # On the Clang legs this is the paired libstdc++ rather than a compiler.
      # The libc++ leg skips it: libc++ replaces libstdc++, which is its point.
      - name: Install GCC
        if: matrix.libcxx != true
        uses: rhalbersma/cpp-ci/.github/actions/install-gcc@df5060f4251a3e20c0860661c4ca761f905392a3
        with:
          version: ${{ matrix.family == 'gcc' && matrix.version || matrix.gcc_version }}
          trunk: ${{ matrix.family == 'gcc' && matrix.trunk || matrix.gcc_trunk }}
          symlink_binaries: ${{ matrix.family == 'gcc' }}

      - name: Install Clang
        if: matrix.family == 'clang'
        uses: rhalbersma/cpp-ci/.github/actions/install-clang@df5060f4251a3e20c0860661c4ca761f905392a3
        with:
          version: ${{ matrix.version }}
          llvm_suffix: ${{ matrix.llvm_suffix }}
          libcxx: ${{ matrix.libcxx == true }}

      # Every leg needs these, not just the libc++ one: each triplet chainloads
      # a toolchain file that builds the dependencies with the compiler under
      # test. See the naming step below for what went wrong without them.
      - name: Locate the overlay triplets
        id: overlay
        uses: rhalbersma/cpp-ci/.github/actions/vcpkg-overlay@df5060f4251a3e20c0860661c4ca761f905392a3

      # Named once here rather than in every expression below, and the cache
      # key with them: it has to name the rung, or a tier change would restore
      # archives built by a different compiler.
      #
      # Deliberately not CC and CXX, which would reach the vcpkg install too
      # and select a compiler without selecting a standard library. The
      # dependencies are pointed at the compiler under test through the
      # overlay triplet instead, which is what every other workflow here does:
      # the chainloaded toolchain file reads the VCPKG_*_VERSION set below.
      #
      # Building them with the runner's default GCC was the earlier reading of
      # this, and it held only while the legs ran on one rung. At the GCC
      # development rung it does not: the trunk snapshot carries its own
      # libstdc++, and a Boost.Test built against the runner's 13 fails inside
      # its own parameter registration, reporting a name it has read off the
      # end of. Four of seventy-five tests, with no diagnostic from ASan --
      # the mismatch is an ABI one, not a memory error it can see.
      - name: Name the toolchain and its cache
        env:
          FAMILY: ${{ matrix.family }}
          VERSION: ${{ matrix.version }}
          LABEL: ${{ matrix.label }}
          LEG: ${{ matrix.id }}
          LIBCXX: ${{ matrix.libcxx == true }}
          CXXFLAGS_RUNG: ${{ matrix.cxxflags }}
          GCC_TRIPLET: ${{ inputs.vcpkg_gcc_triplet }}
          CLANG_TRIPLET: ${{ inputs.vcpkg_clang_triplet }}
          LIBCXX_TRIPLET: ${{ inputs.vcpkg_libcxx_triplet }}
        run: |
          set -euo pipefail

          # The three triplets reach GITHUB_ENV from inputs this workflow does
          # not own, and the one it picks names a directory vcpkg installs
          # into. Reduced to the characters a triplet is made of and then
          # required to be unchanged, so a wrong value fails here rather than
          # being quietly mangled into a working one. It is the reduced value
          # that is written below, not the input it came from.
          gcc_triplet=$(printf '%s' "$GCC_TRIPLET" | tr -cd '[:alnum:]._-')
          clang_triplet=$(printf '%s' "$CLANG_TRIPLET" | tr -cd '[:alnum:]._-')
          libcxx_triplet=$(printf '%s' "$LIBCXX_TRIPLET" | tr -cd '[:alnum:]._-')
          if [ "$gcc_triplet" != "$GCC_TRIPLET" ] ||
             [ "$clang_triplet" != "$CLANG_TRIPLET" ] ||
             [ "$libcxx_triplet" != "$LIBCXX_TRIPLET" ]; then
            echo "::error::the vcpkg triplet inputs must match [A-Za-z0-9._-]"
            exit 1
          fi

          if [ "$FAMILY" = "gcc" ]; then
            echo "TOOLCHAIN_CC=gcc-${VERSION}"      >> "$GITHUB_ENV"
            echo "TOOLCHAIN_CXX=g++-${VERSION}"     >> "$GITHUB_ENV"
            echo "VCPKG_GCC_VERSION=${VERSION}"     >> "$GITHUB_ENV"
            echo "VCPKG_TRIPLET=${gcc_triplet}"     >> "$GITHUB_ENV"
          else
            echo "TOOLCHAIN_CC=clang-${VERSION}"    >> "$GITHUB_ENV"
            echo "TOOLCHAIN_CXX=clang++-${VERSION}" >> "$GITHUB_ENV"
            # Read again by the vcpkg CMake integration, so the compiler
            # selection has to outlive the install step.
            echo "VCPKG_CLANG_VERSION=${VERSION}"   >> "$GITHUB_ENV"
            if [ "$LIBCXX" = "true" ]; then
              echo "VCPKG_TRIPLET=${libcxx_triplet}" >> "$GITHUB_ENV"
            else
              echo "VCPKG_TRIPLET=${clang_triplet}"  >> "$GITHUB_ENV"
              # The rung's own flags select a libstdc++ outside /usr. They are
              # for the legs that use one, and wrong for the libc++ leg, which
              # installs no GCC at all -- the same reasoning the Configure
              # step below applies to CMAKE_CXX_FLAGS.
              echo "VCPKG_CLANG_FLAGS=${CXXFLAGS_RUNG}" >> "$GITHUB_ENV"
            fi
          fi
          echo "VCPKG_CACHE_KEY=vcpkg-sanitizers-${LEG}-${LABEL}-" >> "$GITHUB_ENV"
          # Defined for every leg, so Configure below can name it unconditionally.
          echo "IGNORELIST_FLAG=" >> "$GITHUB_ENV"

      # implicit-conversion flags every value-changing conversion, including
      # the deliberate ones. libstdc++'s __formatter_int takes an absolute
      # value by negating into the unsigned type -- correct, intentional, and
      # not this project's to fix -- and Boost.Test does likewise. Instrument
      # the code under test and nothing else, or the leg reports only on
      # libraries the caller does not own.
      - name: Ignore conversions in code the caller does not own
        if: matrix.ignore_foreign_code
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/sanitizer-ignorelist.txt" << 'IGNORE'
          src:*/include/c++/*
          src:*/lib/clang/*/include/*
          src:*/vcpkg_installed/*
          src:*/vcpkg/buildtrees/*
          src:*/usr/include/*
          IGNORE
          echo "IGNORELIST_FLAG=-fsanitize-ignorelist=$GITHUB_WORKSPACE/sanitizer-ignorelist.txt" >> "$GITHUB_ENV"

      - name: Report toolchain versions
        run: |
          "$TOOLCHAIN_CC" --version
          "$TOOLCHAIN_CXX" --version
          cmake --version

      # vcpkg's own x-gha backend was removed, so cache its binary packages
      # with actions/cache; the archives are named by ABI hash.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: ${{ env.VCPKG_CACHE_KEY }}

      - name: Install the test dependencies
        uses: rhalbersma/cpp-ci/.github/actions/vcpkg-install@df5060f4251a3e20c0860661c4ca761f905392a3
        with:
          triplet: ${{ env.VCPKG_TRIPLET }}
          overlay_triplets: ${{ steps.overlay.outputs.triplets }}

      # Keyed on the archives' contents: an unconditional save would add an
      # entry per run and evict this repo's other caches.
      - name: Save vcpkg binary cache
        if: >-
          hashFiles('vcpkg-cache/**') != '' &&
          steps.vcpkg-cache.outputs.cache-matched-key !=
          format('{0}{1}', env.VCPKG_CACHE_KEY, hashFiles('vcpkg-cache/**'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}${{ hashFiles('vcpkg-cache/**') }}

      # The sanitizer flags go to the link as well as the compile: each one
      # needs its runtime pulled in. The caller's cxx_flags follow the
      # sanitizer's own, so a repository can override what it chose.
      - name: Configure
        env:
          # The rung's cxxflags point Clang at a libstdc++ living outside
          # /usr -- the trunk snapshot's -- and are wrong for the libc++ leg
          # twice over: it installs no GCC, so the path does not exist, and
          # libc++ is what it is there to use. clang-libc++.yml drops them for
          # the same reason.
          SANITIZER_FLAGS: ${{ matrix.flags }} ${{ matrix.libcxx != true && matrix.cxxflags || '' }}
          CXX_FLAGS: ${{ inputs.cxx_flags }}
          OVERLAY_TRIPLETS: ${{ steps.overlay.outputs.triplets }}
          EXTRA_CMAKE: ${{ inputs.cmake_args }}
        shell: bash
        run: |
          set -euo pipefail
          read -ra extra <<< "$EXTRA_CMAKE"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER="$TOOLCHAIN_CC" \
            -DCMAKE_CXX_COMPILER="$TOOLCHAIN_CXX" \
            -DCMAKE_CXX_FLAGS="$SANITIZER_FLAGS $IGNORELIST_FLAG $CXX_FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$SANITIZER_FLAGS" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" \
            -DVCPKG_OVERLAY_TRIPLETS="$OVERLAY_TRIPLETS" \
            "${extra[@]}"

      - name: Build
        run: cmake --build build -v

      # read -ra: matrix.options is a list of NAME=VALUE settings for env,
      # so it has to word-split -- but unquoted it would glob as well.
      - name: Test
        shell: bash
        env:
          OPTIONS: ${{ matrix.options }}
        run: |
          set -euo pipefail
          read -ra options <<< "$OPTIONS"
          env "${options[@]}" ctest --test-dir build --output-on-failure

  # One check name that does not move, for branch protection to require.
  #
  # The legs are named for compiler versions -- "15 Debug", "24-SVN Debug" --
  # and the tier ladder slides those forward by design: the day GCC 16 becomes
  # stable, "15 Debug" stops existing and a required check naming it waits
  # forever. The reduction on pull requests moves them too, so the names a
  # pull request reports are not even the names a push reports.
  #
  # This job's name does not depend on the matrix, so a caller requires
  # "<its job id> / all" once and never revisits it. always() so it runs when
  # a leg failed rather than being skipped with it -- which is the whole point.
  all:
    name: all
    needs: build
    # Not always(): that runs on cancellation too, so a push superseding an
    # in-flight run left this red on the head it had just replaced -- and
    # started a runner to do it, after the run was already cancelled. Three
    # gates reported failure that way within a minute of being added, on
    # workflows whose legs had passed every step.
    #
    # !cancelled() still runs when a leg fails, which is the whole job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every leg succeeded
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          echo "legs: $RESULT"
          # Only success passes. A skipped matrix means the ladder job failed
          # or emitted nothing, which is a red run, not an absent one.
          test "$RESULT" = success
