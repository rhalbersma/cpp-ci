name: Sanitizers

permissions:
  contents: read

# No concurrency group; see gcc.yml. It belongs to the calling stub.

on:
  workflow_call:
    inputs:
      gcc_tiers:
        description: Comma-separated rungs for the legs GCC runs.
        type: string
        required: false
        default: stable,qualification,development
      clang_tiers:
        description: Comma-separated rungs for the legs Clang runs.
        type: string
        required: false
        default: stable,qualification,development
      reduce_on_pr:
        description: Whether a pull request runs the floor and ceiling alone.
        type: boolean
        required: false
        default: true
      vcpkg_triplet:
        description: Triplet for the dependencies on every leg but the libc++ one.
        type: string
        required: false
        default: x64-linux
      vcpkg_libcxx_triplet:
        description: >
          Overlay triplet for the libc++ leg. Boost.Test has to be built
          against libc++ as well: ASan's container-overflow checking reads
          annotations the standard library emits, and a Boost.Test built
          against libstdc++ would not link with it in any case.
        type: string
        required: false
        default: x64-linux-libcxx
      cxx_flags:
        description: Flags appended after the sanitizer's own, for the caller.
        type: string
        required: false
        default: ""
      cmake_args:
        description: Extra -D arguments for the configure step.
        type: string
        required: false
        default: ""

jobs:
  # The legs are crossed with the ladder here rather than written out: a
  # sanitizer's instrumentation is not fixed across releases any more than it
  # is across compilers. GCC's UBSan does not diagnose the signed overflow
  # Clang's does on a _BitInt(2), and a bit-precise library has no reason to
  # assume one GCC agrees with the next about that either.
  ladder:
    name: Resolve the ladder
    runs-on: ubuntu-24.04
    outputs:
      legs: ${{ steps.cross.outputs.matrix }}
    steps:
      - id: gcc
        uses: rhalbersma/cpp-ci/.github/actions/toolchain@8c2e595fd14e4e1841ed7de952b436d7bed45897
        with:
          mode: matrix
          toolchain: gcc
          tiers: ${{ inputs.gcc_tiers }}
          build_types: Debug
          reduce_on_pr: ${{ inputs.reduce_on_pr }}

      - id: clang
        uses: rhalbersma/cpp-ci/.github/actions/toolchain@8c2e595fd14e4e1841ed7de952b436d7bed45897
        with:
          mode: matrix
          toolchain: clang
          tiers: ${{ inputs.clang_tiers }}
          build_types: Debug
          reduce_on_pr: ${{ inputs.reduce_on_pr }}

      - id: cross
        shell: bash
        env:
          GCC_RUNGS: ${{ steps.gcc.outputs.matrix }}
          CLANG_RUNGS: ${{ steps.clang.outputs.matrix }}
        run: |
          set -euo pipefail

          # Leak detection deliberately left on. A library that allocates
          # nothing has nothing to report, and the repositories that do
          # allocate are the ones that leg exists for.
          #
          # ASan runs against both standard libraries. Its detection is a
          # shared runtime, so a second compiler alone would re-run one check
          # -- but the container-overflow annotations are not shared: libc++
          # instruments vector, string and deque, libstdc++ annotates vector
          # alone and only under _GLIBCXX_SANITIZE_VECTOR.
          #
          # UBSan twice over, because the two implementations do not check the
          # same set and a clean run under one says nothing about the other.
          #
          # implicit-conversion is Clang's alone -- g++ rejects the group --
          # and catches the value-dependent truncations and sign changes that
          # -Wconversion can only diagnose where it proves them statically.
          legs='[
            {"id":"asan","name":"ASan + LSan","compiler":"GCC","family":"gcc",
             "flags":"-fsanitize=address -fno-omit-frame-pointer -g",
             "options":"ASAN_OPTIONS=detect_leaks=1"},
            {"id":"asan-libcxx","name":"ASan + LSan","compiler":"Clang libc++","family":"clang","libcxx":true,
             "flags":"-fsanitize=address -fno-omit-frame-pointer -g -stdlib=libc++",
             "options":"ASAN_OPTIONS=detect_leaks=1"},
            {"id":"ubsan-gcc","name":"UBSan","compiler":"GCC","family":"gcc",
             "flags":"-fsanitize=undefined -fno-sanitize-recover=undefined -g",
             "options":"UBSAN_OPTIONS=print_stacktrace=1"},
            {"id":"ubsan-clang","name":"UBSan","compiler":"Clang","family":"clang",
             "flags":"-fsanitize=undefined -fno-sanitize-recover=undefined -g",
             "options":"UBSAN_OPTIONS=print_stacktrace=1"},
            {"id":"implicit-conversion","name":"Implicit conversion","compiler":"Clang","family":"clang",
             "ignore_foreign_code":true,
             "flags":"-fsanitize=implicit-conversion -fno-sanitize-recover=implicit-conversion -g",
             "options":"UBSAN_OPTIONS=print_stacktrace=1"}
          ]'

          matrix=$(jq -c -n \
            --argjson legs "$legs" \
            --argjson gcc "$GCC_RUNGS" \
            --argjson clang "$CLANG_RUNGS" \
            '{include: [ $legs[] as $leg
               | (if $leg.family == "gcc" then $gcc.include else $clang.include end)[] as $rung
               | $leg + $rung ]}')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq -r '.include | "\(length) legs:", (.[] | "  \(.name) / \(.compiler) \(.label)")' <<< "$matrix"

  build:
    name: ${{ matrix.name }} / ${{ matrix.compiler }} ${{ matrix.label }}
    needs: ladder
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ladder.outputs.legs) }}
    env:
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This repository's own actions by owner/repo@sha, not by ./ path: a
      # relative reference resolves against the caller's workspace, which
      # holds the caller's checkout and none of this. The pin keeps a caller's
      # pinned workflow from silently pulling actions off a moving main.
      - uses: rhalbersma/cpp-ci/.github/actions/apt-retry@8c2e595fd14e4e1841ed7de952b436d7bed45897

      # On the Clang legs this is the paired libstdc++ rather than a compiler.
      # The libc++ leg skips it: libc++ replaces libstdc++, which is its point.
      - name: Install GCC
        if: matrix.libcxx != true
        uses: rhalbersma/cpp-ci/.github/actions/install-gcc@8c2e595fd14e4e1841ed7de952b436d7bed45897
        with:
          version: ${{ matrix.family == 'gcc' && matrix.version || matrix.gcc_version }}
          trunk: ${{ matrix.family == 'gcc' && matrix.trunk || matrix.gcc_trunk }}
          symlink_binaries: ${{ matrix.family == 'gcc' }}

      - name: Install Clang
        if: matrix.family == 'clang'
        uses: rhalbersma/cpp-ci/.github/actions/install-clang@8c2e595fd14e4e1841ed7de952b436d7bed45897
        with:
          version: ${{ matrix.version }}
          llvm_suffix: ${{ matrix.llvm_suffix }}
          libcxx: ${{ matrix.libcxx == true }}

      # Only the libc++ leg needs these: its Boost.Test is rebuilt against
      # libc++ through the chainloaded triplet, and the other legs take the
      # runner's default standard library.
      - name: Locate the overlay triplets
        if: matrix.libcxx == true
        id: overlay
        uses: rhalbersma/cpp-ci/.github/actions/vcpkg-overlay@8c2e595fd14e4e1841ed7de952b436d7bed45897

      # Named once here rather than in every expression below, and the cache
      # key with them: it has to name the rung, or a tier change would restore
      # archives built by a different compiler. Deliberately not CC and CXX:
      # those would also reach the vcpkg install below, which is meant to
      # build Boost.Test with the runner's default compiler as before.
      - name: Name the toolchain and its cache
        env:
          FAMILY: ${{ matrix.family }}
          VERSION: ${{ matrix.version }}
          LABEL: ${{ matrix.label }}
          LEG: ${{ matrix.id }}
        run: |
          set -euo pipefail
          if [ "$FAMILY" = "gcc" ]; then
            echo "TOOLCHAIN_CC=gcc-${VERSION}"      >> "$GITHUB_ENV"
            echo "TOOLCHAIN_CXX=g++-${VERSION}"     >> "$GITHUB_ENV"
          else
            echo "TOOLCHAIN_CC=clang-${VERSION}"    >> "$GITHUB_ENV"
            echo "TOOLCHAIN_CXX=clang++-${VERSION}" >> "$GITHUB_ENV"
            # Read again by the vcpkg CMake integration, so the libc++ leg's
            # compiler selection has to outlive the install step.
            echo "VCPKG_CLANG_VERSION=${VERSION}"   >> "$GITHUB_ENV"
          fi
          echo "VCPKG_CACHE_KEY=vcpkg-sanitizers-${LEG}-${LABEL}-" >> "$GITHUB_ENV"
          # Defined for every leg, so Configure below can name it unconditionally.
          echo "IGNORELIST_FLAG=" >> "$GITHUB_ENV"

      # implicit-conversion flags every value-changing conversion, including
      # the deliberate ones. libstdc++'s __formatter_int takes an absolute
      # value by negating into the unsigned type -- correct, intentional, and
      # not this project's to fix -- and Boost.Test does likewise. Instrument
      # the code under test and nothing else, or the leg reports only on
      # libraries the caller does not own.
      - name: Ignore conversions in code the caller does not own
        if: matrix.ignore_foreign_code
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/sanitizer-ignorelist.txt" << 'IGNORE'
          src:*/include/c++/*
          src:*/lib/clang/*/include/*
          src:*/vcpkg_installed/*
          src:*/vcpkg/buildtrees/*
          src:*/usr/include/*
          IGNORE
          echo "IGNORELIST_FLAG=-fsanitize-ignorelist=$GITHUB_WORKSPACE/sanitizer-ignorelist.txt" >> "$GITHUB_ENV"

      - name: Report toolchain versions
        run: |
          "$TOOLCHAIN_CC" --version
          "$TOOLCHAIN_CXX" --version
          cmake --version

      # vcpkg's own x-gha backend was removed, so cache its binary packages
      # with actions/cache; the archives are named by ABI hash.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: ${{ env.VCPKG_CACHE_KEY }}

      - name: Install the test dependencies
        uses: rhalbersma/cpp-ci/.github/actions/vcpkg-install@8c2e595fd14e4e1841ed7de952b436d7bed45897
        with:
          triplet: ${{ matrix.libcxx == true && inputs.vcpkg_libcxx_triplet || inputs.vcpkg_triplet }}
          overlay_triplets: ${{ matrix.libcxx == true && steps.overlay.outputs.triplets || '' }}

      # Keyed on the archives' contents: an unconditional save would add an
      # entry per run and evict this repo's other caches.
      - name: Save vcpkg binary cache
        if: >-
          hashFiles('vcpkg-cache/**') != '' &&
          steps.vcpkg-cache.outputs.cache-matched-key !=
          format('{0}{1}', env.VCPKG_CACHE_KEY, hashFiles('vcpkg-cache/**'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}${{ hashFiles('vcpkg-cache/**') }}

      # The sanitizer flags go to the link as well as the compile: each one
      # needs its runtime pulled in. The caller's cxx_flags follow the
      # sanitizer's own, so a repository can override what it chose.
      - name: Configure
        env:
          # The rung's cxxflags point Clang at a libstdc++ living outside
          # /usr -- the trunk snapshot's -- and are wrong for the libc++ leg
          # twice over: it installs no GCC, so the path does not exist, and
          # libc++ is what it is there to use. clang-libc++.yml drops them for
          # the same reason.
          SANITIZER_FLAGS: ${{ matrix.flags }} ${{ matrix.libcxx != true && matrix.cxxflags || '' }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER="$TOOLCHAIN_CC"
          -DCMAKE_CXX_COMPILER="$TOOLCHAIN_CXX"
          -DCMAKE_CXX_FLAGS="$SANITIZER_FLAGS $IGNORELIST_FLAG ${{ inputs.cxx_flags }}"
          -DCMAKE_EXE_LINKER_FLAGS="$SANITIZER_FLAGS"
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ matrix.libcxx == true && inputs.vcpkg_libcxx_triplet || inputs.vcpkg_triplet }}
          ${{ matrix.libcxx == true && format('-DVCPKG_OVERLAY_TRIPLETS={0}', steps.overlay.outputs.triplets) || '' }}
          ${{ inputs.cmake_args }}

      - name: Build
        run: cmake --build build -v

      - name: Test
        run: env ${{ matrix.options }} ctest --test-dir build --output-on-failure
