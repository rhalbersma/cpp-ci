name: Scorecard

# id-token to publish to the OpenSSF dataset the README badge reads,
# security-events to file the findings, actions: read for the workflow
# analysis. A called workflow cannot exceed its caller's permissions, so the
# stub has to grant all of these too.
permissions:
  contents: read
  security-events: write
  id-token: write
  actions: read

# Concurrency belongs to a calling stub -- but this workflow also runs for
# this repository, where there is no stub to hold it, so the group is declared
# for the self-run triggers below. github.workflow rather than
# github.workflow_ref: the latter names the caller inside a called workflow,
# which is how a shared workflow once cancelled its own caller.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This repository is a dependency of every repository that calls it, so its own
# supply-chain posture is worth measuring rather than assuming -- the pinning
# and permissions here propagate outward. Analysis reads repository metadata,
# not source, so unlike the compiler workflows it applies to a repository that
# ships no C++ at all.
on:
  push:
    branches: [ main ]
  branch_protection_rule:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      publish_results:
        description: >
          Whether to publish to the OpenSSF dataset, which is what feeds a
          README badge. A fork or a private mirror wants this off.
        type: boolean
        required: false
        default: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04

    steps:
      # No credentials on disk: the analysis reads the repository's public
      # metadata and has no use for a token in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish_results }}

      # Publishing feeds the README badge's dataset; the upload below also
      # surfaces the findings in the repository's Security tab.
      - name: Upload SARIF results as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF results to code scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
