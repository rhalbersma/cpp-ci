name: Actionlint

permissions:
  contents: read

# No concurrency group; see gcc.yml. It belongs to the calling stub, and this
# workflow's own push runs are short enough not to want one.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      paths:
        description: Glob of workflow files to lint, relative to the checkout.
        type: string
        required: false
        default: .github/workflows/*.yml
      shellcheck:
        description: >
          Value for actionlint's -shellcheck flag. Empty disables it, keeping
          this workflow to Actions syntax and expressions and leaving
          ShellCheck policy to be managed on its own.
        type: string
        required: false
        default: ""
      go_version:
        description: Go toolchain used to install actionlint.
        type: string
        required: false
        default: "1.25.1"
      actionlint_version:
        description: actionlint release to install.
        type: string
        required: false
        default: v1.7.11

jobs:
  lint:
    name: actionlint
    runs-on: ubuntu-24.04

    steps:
      # Full history: the pin check resolves commits this workflow's own
      # references name, which a shallow clone does not have.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version || '1.25.1' }}
          cache: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: ${{ inputs.actionlint_version || 'v1.7.11' }}
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      # This repository lints itself with the workflow it hands to others, so
      # a change that would break a caller breaks this repository's own run.
      # The pin check is this repository's alone -- it reads commits in this
      # history, and the script lives here -- so it is guarded by name.
      #
      # Not by event: github.event_name inside a called workflow is the
      # caller's event, never "workflow_call", so the guard that named it
      # matched every caller and sent them looking for a script they do not
      # have. github.repository is the caller's too, which is exactly what
      # makes it the right test here.
      - name: Check this repository's own pins
        if: github.repository == 'rhalbersma/cpp-ci'
        run: |
          pip install --quiet pyyaml
          python3 .github/scripts/check_internal_pins.py

      - name: Lint workflows
        env:
          PATHS: ${{ inputs.paths || '.github/workflows/*.yml' }}
          SHELLCHECK: ${{ inputs.shellcheck }}
        run: |
          set -euo pipefail
          # Unquoted on purpose: PATHS is a glob the shell has to expand.
          # shellcheck disable=SC2086
          actionlint -shellcheck="$SHELLCHECK" $PATHS
