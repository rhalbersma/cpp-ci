name: MinGW

permissions:
  contents: read

# No concurrency group; see gcc.yml. It belongs to the calling stub.

on:
  workflow_call:
    inputs:
      tiers:
        description: Comma-separated rungs, tracking GCC's through WinLibs.
        type: string
        required: false
        default: stable,qualification,development
      build_types:
        description: Comma-separated CMake build types.
        type: string
        required: false
        default: Release,Debug
      reduce_on_pr:
        description: >
          Whether a pull request runs the floor and ceiling in Debug alone.
          False by default, as in sanitizers.yml. A caller makes the "all"
          gate its required check, and that gate covers only the legs that
          ran: reduced, it reports success on a pull request that never
          compiled the middle rung, so a break there merges green and reddens
          main on the push behind it. Pass true where something else genuinely
          covers that rung.
        type: boolean
        required: false
        default: false
      vcpkg_triplet:
        description: >
          Triplet for the dependencies. x64-mingw-dynamic builds against
          whatever gcc resolves to on PATH, by then the pinned WinLibs
          toolchain, so the libstdc++ ABI matches.
        type: string
        required: false
        default: x64-mingw-dynamic
      cmake_args:
        description: Extra -D arguments for the configure step.
        type: string
        required: false
        default: ""
      cap_vector_width:
        description: >
          Pass -mprefer-vector-width=128 to every target on this toolchain.

          The Windows x64 ABI guarantees a 16-byte aligned stack, and GCC
          emits `vmovdqa` -- a 32-byte aligned move -- against fixed frame
          slots anyway, in functions that never realigned. Such a slot faults
          whenever rsp lands on a 32-byte boundary and works when it does not,
          which is why rhalbersma/bit_set#54 surfaced as four Debug tests
          segfaulting with no output and took three pull requests to find. A
          later scan of that project's objects found 41 more, including in
          Release, where nothing had ever crashed.

          Capping the width is the only remedy the target offers.
          -mstackrealign realigns to the *preferred* stack boundary, and
          mingw-w64 refuses to let that exceed 16 bytes: GCC 13, 15.3.0 and
          the 17 snapshot all reject -mpreferred-stack-boundary=5 as "not
          between 3 and 4", where Linux x86-64 accepts it. Nor is there an
          upstream fix to wait for -- GCC PR target/49001 has been open on
          this since 2011.

          On by default because the failure is silent, intermittent, and
          costs nothing to prevent on a project that emits no wide vectors
          anyway. Turn it off only to reproduce the bug deliberately.
        type: boolean
        required: false
        default: true
      abi_check:
        description: >
          Scan the built objects for stack accesses the Windows x64 ABI does
          not guarantee, before running the tests. GCC 15 and 16 emitted
          `vmovdqa %ymm0,-0x50(%rbp)` into a frame aligned only to 16, which
          faults with no output and nothing in the test log to explain it -
          see rhalbersma/bit_set#54, where it cost three pull requests to
          find. The scan names the instruction and the function.

          With cap_vector_width on, this stops being able to discover the bug
          -- there are no wide vectors left to misalign -- and becomes a
          regression guard on the cap instead: it fails the day the cap is
          turned off, stops reaching some target, or a compiler finds another
          route to an over-aligned frame slot. That is a smaller job than it
          was, and still worth the two seconds it takes.
        type: boolean
        required: false
        default: true

jobs:
  ladder:
    name: Resolve the ladder
    runs-on: ubuntu-24.04
    outputs:
      legs: ${{ steps.ladder.outputs.matrix }}
    steps:
      - id: ladder
        uses: rhalbersma/cpp-ci/.github/actions/toolchain@e39ce4045d855e89f9f1e2475562b4ba7a38cf33
        with:
          mode: matrix
          toolchain: mingw
          tiers: ${{ inputs.tiers }}
          build_types: ${{ inputs.build_types }}
          reduce_on_pr: ${{ inputs.reduce_on_pr }}

  build:
    name: ${{ matrix.label }} ${{ matrix.build_type }}
    needs: ladder
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ladder.outputs.legs) }}
    env:
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # found=false, and every step below skips: a development snapshot can be
      # absent between release branches, and that is not this project's fault.
      - name: Install the WinLibs toolchain
        id: winlibs
        uses: rhalbersma/cpp-ci/.github/actions/install-winlibs@e39ce4045d855e89f9f1e2475562b4ba7a38cf33
        with:
          tag_prefix: ${{ matrix.tag_prefix }}
          snapshot: ${{ matrix.snapshot }}
          token: ${{ github.token }}

      - name: Name the cache
        if: steps.winlibs.outputs.found == 'true'
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: echo "VCPKG_CACHE_KEY=vcpkg-mingw-${LABEL}-" >> "$GITHUB_ENV"

      - name: Report toolchain versions
        if: steps.winlibs.outputs.found == 'true'
        run: |
          gcc --version
          g++ --version
          cmake --version

      # vcpkg's own x-gha backend was removed, so cache its binary packages
      # with actions/cache; the archives are named by ABI hash.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        if: steps.winlibs.outputs.found == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: ${{ env.VCPKG_CACHE_KEY }}

      - name: Install the test dependencies
        if: steps.winlibs.outputs.found == 'true'
        uses: rhalbersma/cpp-ci/.github/actions/vcpkg-install@e39ce4045d855e89f9f1e2475562b4ba7a38cf33
        with:
          triplet: ${{ inputs.vcpkg_triplet }}

      # Keyed on the archives' contents: an unconditional save would add an
      # entry per run and evict this repo's other caches.
      - name: Save vcpkg binary cache
        if: >-
          steps.winlibs.outputs.found == 'true' &&
          hashFiles('vcpkg-cache/**') != '' &&
          steps.vcpkg-cache.outputs.cache-matched-key !=
          format('{0}{1}', env.VCPKG_CACHE_KEY, hashFiles('vcpkg-cache/**'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}${{ hashFiles('vcpkg-cache/**') }}

      # Ninja rather than "MinGW Makefiles", which wants a mingw32-make.exe
      # WinLibs does not bundle; not preinstalled either. Straight from the
      # upstream release rather than Chocolatey, so the one artifact this step
      # trusts is a fixed tag's, and its hash is checked before it runs.
      #
      # utf8NoBOM for the reason given at the WinLibs PATH step.
      - name: Install Ninja
        if: steps.winlibs.outputs.found == 'true'
        run: |
          $url = 'https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-win.zip'
          $want = '07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65'
          Invoke-WebRequest -Uri $url -OutFile ninja.zip -MaximumRetryCount 3 -RetryIntervalSec 5
          $got = (Get-FileHash ninja.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "ninja-win.zip sha256 $got, expected $want" }
          Expand-Archive ninja.zip -DestinationPath C:\ninja
          echo "C:\ninja" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8NoBOM -Append

      # Explicit: Ninja is single-config and vcpkg defaults to Debug, so the
      # build type has to be named for the Test step to put the matching
      # Boost.Test DLL on PATH.
      #
      # VCPKG_APPLOCAL_DEPS=OFF, because the toolchain otherwise appends a
      # "vcpkg z-applocal" command to the link edge of every test executable.
      # Each one reopens the .exe ninja has just written and copies the same
      # DLLs next to it; run concurrently, against a virus scanner that opens
      # new executables too, one eventually loses the race and the build dies
      # with a sharing violation. The Test step puts those DLLs on PATH
      # instead, which deploys nothing and cannot race.
      - name: Configure
        if: steps.winlibs.outputs.found == 'true'
        shell: pwsh
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          TRIPLET: ${{ inputs.vcpkg_triplet }}
          EXTRA_CMAKE: ${{ inputs.cmake_args }}
          CAP_VECTOR_WIDTH: ${{ inputs.cap_vector_width }}
        run: |
          # -split, then @extra: PowerShell would otherwise pass the whole
          # string as one argument. Empty contributes no argument at all.
          $extra = @()
          if ($env:EXTRA_CMAKE) {
            $extra = $env:EXTRA_CMAKE -split '\s+' | Where-Object { $_ }
          }
          # CMAKE_CXX_FLAGS lands ahead of a target's own compile options, so
          # a project that adds -march=native later still gets it. Checked
          # rather than assumed, because an option that a later -march undid
          # would be worse than none: on the mingw-w64 cross at -O0, -O1 and
          # -O2, "-mprefer-vector-width=128 -march=x86-64-v3" and the reverse
          # order both give zero wide-register uses, and both keep __AVX2__
          # defined so 128-bit VEX encodings survive.
          $cap = @()
          if ($env:CAP_VECTOR_WIDTH -eq 'true') {
            $cap = @('-DCMAKE_CXX_FLAGS=-mprefer-vector-width=128')
          }
          # @cap before @extra: a caller passing its own -DCMAKE_CXX_FLAGS in
          # cmake_args comes later on the command line and wins, which is the
          # right way round -- but it then owns this problem itself.
          cmake -S . -B build -G Ninja `
            "-DCMAKE_BUILD_TYPE=${env:BUILD_TYPE}" `
            -DCMAKE_C_COMPILER=gcc `
            -DCMAKE_CXX_COMPILER=g++ `
            "-DCMAKE_TOOLCHAIN_FILE=${env:VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=${env:TRIPLET}" `
            -DVCPKG_APPLOCAL_DEPS=OFF `
            @cap `
            @extra

      - name: Build
        if: steps.winlibs.outputs.found == 'true'
        run: cmake --build build -v

      # Before the tests rather than after. A fault of this kind kills the
      # process with no output at all, so a red Test step says only
      # "SegFault"; running the scan first means the diagnosis is in the log
      # even when the test run dies. require_wide_stack is off because a
      # project that builds without wide vectors legitimately has none, and
      # failing it for that would be noise rather than a finding.
      - name: Check Windows stack-ABI conformance
        if: inputs.abi_check && steps.winlibs.outputs.found == 'true'
        uses: rhalbersma/cpp-ci/.github/actions/check-windows-abi@e39ce4045d855e89f9f1e2475562b4ba7a38cf33
        with:
          objects: build
          objdump: objdump
          assembler: gcc
          require_wide_stack: "false"

      # vcpkg keeps the debug DLLs in their own subdirectory, and the two
      # sets share file names, so only the one matching the build type may go
      # on PATH.
      - name: Test
        if: steps.winlibs.outputs.found == 'true'
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          TRIPLET: ${{ inputs.vcpkg_triplet }}
        run: |
          $bin = if ($env:BUILD_TYPE -eq "Debug") { "debug\bin" } else { "bin" }
          $dlls = Join-Path $env:GITHUB_WORKSPACE "build\vcpkg_installed\${env:TRIPLET}\$bin"
          if (-not (Test-Path $dlls)) { throw "No vcpkg bin directory at $dlls" }
          $env:PATH = "$dlls;$env:PATH"
          ctest --test-dir build --output-on-failure

  # One check name that does not move, for branch protection to require.
  #
  # The legs are named for compiler versions -- "15 Debug", "24-SVN Debug" --
  # and the tier ladder slides those forward by design: the day GCC 16 becomes
  # stable, "15 Debug" stops existing and a required check naming it waits
  # forever. The reduction on pull requests moves them too, so the names a
  # pull request reports are not even the names a push reports.
  #
  # This job's name does not depend on the matrix, so a caller requires
  # "<its job id> / all" once and never revisits it. always() so it runs when
  # a leg failed rather than being skipped with it -- which is the whole point.
  all:
    name: all
    needs: build
    # Not always(): that runs on cancellation too, so a push superseding an
    # in-flight run left this red on the head it had just replaced -- and
    # started a runner to do it, after the run was already cancelled. Three
    # gates reported failure that way within a minute of being added, on
    # workflows whose legs had passed every step.
    #
    # !cancelled() still runs when a leg fails, which is the whole job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every leg succeeded
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          echo "legs: $RESULT"
          # Only success passes. A skipped matrix means the ladder job failed
          # or emitted nothing, which is a red run, not an absent one.
          test "$RESULT" = success
