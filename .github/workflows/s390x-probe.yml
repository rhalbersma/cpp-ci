name: s390x probe

permissions:
  contents: read

on:
  push:
    branches: [ claude/s390x-probe ]

jobs:
  probe:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/apt-retry
      - name: Reproduce the early-exit awk under pipefail
        run: |
          set +e -uo pipefail
          sudo apt-get update > /dev/null 2>&1 || true
          early() { apt-cache policy "$1" | awk -v header="$1:" '$0 == header { found = 1; next } /^[^ ]/ { found = 0 } found && $1 == "Candidate:" { print $2; exit }'; }
          full() { apt-cache policy "$1" | awk -v header="$1:" '$0 == header { found = 1; next } /^[^ ]/ { found = 0 } found && $1 == "Candidate:" && !done { print $2; done = 1 }'; }
          for f in early full; do
            for p in g++-15-s390x-linux-gnu qemu-user; do
              declare -A n=()
              for i in $(seq 40); do "$f" "$p" > /dev/null 2> "/tmp/err-$f"; s=$?; n[$s]=$(( ${n[$s]:-0} + 1 )); done
              echo "$f $p: $(for k in "${!n[@]}"; do printf '%s:%s ' "$k" "${n[$k]}"; done) stderr: $(head -c 200 "/tmp/err-$f")"
              unset n
            done
          done
          strace -f -e trace=write -o /tmp/st apt-cache policy qemu-user | awk 'NR==3 { exit }' ; echo "traced status=$?"; tail -5 /tmp/st || true
