name: Clang-Tidy

permissions:
  contents: read

# No concurrency group; see gcc.yml. It belongs to the calling stub.

on:
  workflow_call:
    inputs:
      tiers:
        description: >
          Comma-separated rungs supplying clang-tidy, one leg each. Its own
          input, like clang-format's: a release gains, renames and retires
          checks, so it changes the verdict on code nobody touched.

          All three by default, matching the compiler ladders. A README that
          says Clang 22, 23 and 24 are green is a claim about what a reader
          can build with, and a reader who builds with 24 runs clang-tidy-24
          over their own translation units. Checking one rung answered for
          one of them.
        type: string
        required: false
        default: stable,qualification,development
      gcc_tier:
        description: Rung supplying the libstdc++ Clang compiles against.
        type: string
        required: false
        default: stable
      vcpkg_triplet:
        description: Triplet for the dependencies the compile database needs.
        type: string
        required: false
        default: x64-linux
      vcpkg_features:
        description: >
          Comma-separated manifest features to install, for a manifest that
          keeps its test-only dependencies out of default-features. Additive:
          the default features install either way.
        type: string
        required: false
        default: ""
      include_dir:
        description: >
          Public headers, each also checked as a primary input. Named for the
          directory a CMake project conventionally puts them in.
        type: string
        required: false
        default: include
      include_exclude:
        description: find -path pattern for headers to skip, or empty for none.
        type: string
        required: false
        default: ""
      header_exclude:
        description: >
          Deprecated alias for include_exclude, honoured when that is empty so
          a caller's existing stub keeps working across the rename.
        type: string
        required: false
        default: ""
      src_dir:
        description: >
          The library's own compiled sources. Analysed straight from the
          compile database when the directory is there, so a library with
          sources needs nothing configured and one without has nothing to skip
          past. Empty disables the pass.
        type: string
        required: false
        default: src
      test_dir:
        description: >
          The test tree, analysed the same way and on the same terms as
          src_dir. Supersedes sources_regex.
        type: string
        required: false
        default: test
      self_sufficiency_regex:
        description: >
          run-clang-tidy pattern for the generated per-header units. The one
          pass that cannot be a directory: those units live in the build tree,
          under a path only the caller's CMake knows, so there is no
          convention to discover them by.
        type: string
        required: false
        default: ""
      sources_regex:
        description: >
          Deprecated. An explicit run-clang-tidy pattern for the test tree,
          honoured in place of test_dir when set.
        type: string
        required: false
        default: ""
      adapted_dirs:
        description: >
          Space-separated directories of optional third-party libraries that
          some headers adapt, added with -isystem when present. Inert for a
          repository that has none.
        type: string
        required: false
        default: ""
      cmake_args:
        description: Extra -D arguments for the configure step.
        type: string
        required: false
        default: ""
      generator:
        description: >
          CMake generator for the configure step. Ninja is what the runner
          images carry and what C++20 modules require; a caller needing the
          platform default names it here.
        type: string
        required: false
        default: Ninja

jobs:
  # The rungs, resolved once. clang-tidy needs no per-rung runner -- every leg
  # is ubuntu-24.04 -- so this exists only to turn "which rungs" into a matrix,
  # the compiler workflows' shape for the same reason they have it.
  ladder:
    name: Resolve the ladder
    runs-on: ubuntu-24.04
    outputs:
      legs: ${{ steps.ladder.outputs.matrix }}
    steps:
      # One build type: clang-tidy reads a compile database rather than
      # building, and Debug is the configuration it is read from, for the
      # reason the Configure step gives.
      - id: ladder
        uses: rhalbersma/cpp-ci/.github/actions/toolchain@89f1cd196c6b0f1cdf950b956f5b8d6d4dbec317
        with:
          mode: matrix
          toolchain: clang
          tiers: ${{ inputs.tiers }}
          build_types: Debug
          reduce_on_pr: "false"

  tidy:
    name: clang-tidy ${{ matrix.label }}
    needs: ladder
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ladder.outputs.legs) }}
    env:
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: rhalbersma/cpp-ci/.github/actions/apt-retry@89f1cd196c6b0f1cdf950b956f5b8d6d4dbec317

      - name: Resolve the GCC supplying libstdc++
        id: libstdcxx
        uses: rhalbersma/cpp-ci/.github/actions/toolchain@89f1cd196c6b0f1cdf950b956f5b8d6d4dbec317
        with:
          toolchain: gcc
          tier: ${{ inputs.gcc_tier }}

      # A known-good libstdc++ for the standard library Clang compiles
      # against; the binaries are not wanted, only the headers.
      - name: Install the libstdc++
        uses: rhalbersma/cpp-ci/.github/actions/install-gcc@89f1cd196c6b0f1cdf950b956f5b8d6d4dbec317
        with:
          version: ${{ steps.libstdcxx.outputs.version }}
          trunk: ${{ steps.libstdcxx.outputs.trunk }}
          symlink_binaries: "false"

      - name: Install Clang and clang-tidy
        uses: rhalbersma/cpp-ci/.github/actions/install-clang@89f1cd196c6b0f1cdf950b956f5b8d6d4dbec317
        with:
          version: ${{ matrix.version }}
          llvm_suffix: ${{ matrix.llvm_suffix }}
          tidy: "true"

      - name: Name the toolchain and its cache
        env:
          VERSION: ${{ matrix.version }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          echo "TOOLCHAIN_CC=clang-${VERSION}"    >> "$GITHUB_ENV"
          echo "TOOLCHAIN_CXX=clang++-${VERSION}" >> "$GITHUB_ENV"
          # The rung is part of the key. Each leg builds the dependencies with
          # its own Clang, so one key across the ladder would hand a leg
          # another rung's binaries.
          echo "VCPKG_CACHE_KEY=vcpkg-clang-tidy-${LABEL}-" >> "$GITHUB_ENV"

      # vcpkg's own x-gha backend was removed, so cache its binary packages
      # with actions/cache; the archives are named by ABI hash.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: ${{ env.VCPKG_CACHE_KEY }}

      # vcpkg at this repository's pin rather than the image's, so every leg resolves the same ports.
      - name: Check out vcpkg at the pinned commit
        uses: rhalbersma/cpp-ci/.github/actions/vcpkg-setup@89f1cd196c6b0f1cdf950b956f5b8d6d4dbec317

      # Only so the test tree configures, and with it the compile database
      # below; clang-tidy itself never links anything.
      - name: Install the test dependencies
        uses: rhalbersma/cpp-ci/.github/actions/vcpkg-install@89f1cd196c6b0f1cdf950b956f5b8d6d4dbec317
        with:
          triplet: ${{ inputs.vcpkg_triplet }}
          features: ${{ inputs.vcpkg_features }}

      # Keyed on the archives' contents: an unconditional save would add an
      # entry per run and evict this repo's other caches.
      - name: Save vcpkg binary cache
        if: >-
          hashFiles('vcpkg-cache/**') != '' &&
          steps.vcpkg-cache.outputs.cache-matched-key !=
          format('{0}{1}', env.VCPKG_CACHE_KEY, hashFiles('vcpkg-cache/**'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ env.VCPKG_CACHE_KEY }}${{ hashFiles('vcpkg-cache/**') }}

      # Debug rather than unset, so NDEBUG stays undefined on purpose:
      # -DNDEBUG rewrites every assert before the AST, which these checks read.
      - name: Configure
        shell: bash
        env:
          TRIPLET: ${{ inputs.vcpkg_triplet }}
          EXTRA_CMAKE: ${{ inputs.cmake_args }}
          GENERATOR: ${{ inputs.generator }}
          FEATURES: ${{ inputs.vcpkg_features }}
        run: |
          set -euo pipefail
          read -ra extra <<< "$EXTRA_CMAKE"
          # A CMake list, so the separator is a semicolon rather than a
          # comma. Left empty when the caller named no feature, so the
          # configure line stays the one it has always been.
          features_arg=""
          if [ -n "$FEATURES" ]; then
            features_arg="-DVCPKG_MANIFEST_FEATURES=$(printf '%s' "$FEATURES" | tr -d '[:space:]' | tr ',' ';' | tr -s ';' | sed 's/^;//; s/;$//')"
          fi
          # This job configures and never builds, so nothing generates the
          # module map files that CMake's scanner names in the compile
          # database as @<target>.dir/<source>.o.modmap. clang-tidy replays
          # each entry verbatim and every translation unit then fails on a
          # response file that was never written. Scanning buys this job
          # nothing either way -- clang-tidy reads sources, not BMIs.
          cmake -S . -B build \
            -G "$GENERATOR" \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER="$TOOLCHAIN_CC" \
            -DCMAKE_CXX_COMPILER="$TOOLCHAIN_CXX" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$TRIPLET" \
            ${features_arg:+"$features_arg"} \
            "${extra[@]}"

      # The dialect, the trees and the four passes, in the script a developer
      # runs before pushing. Every pass runs, so one round reports every finding.
      - name: Run clang-tidy's passes
        uses: rhalbersma/cpp-ci/.github/actions/clang-tidy@89f1cd196c6b0f1cdf950b956f5b8d6d4dbec317
        with:
          version: ${{ matrix.version }}
          include_dir: ${{ inputs.include_dir }}
          include_exclude: ${{ inputs.include_exclude || inputs.header_exclude }}
          src_dir: ${{ inputs.src_dir }}
          test_dir: ${{ inputs.test_dir }}
          self_sufficiency_regex: ${{ inputs.self_sufficiency_regex }}
          sources_regex: ${{ inputs.sources_regex }}
          adapted_dirs: ${{ inputs.adapted_dirs }}

      - name: Publish clang-tidy summary
        if: always()
        env:
          LABEL: ${{ matrix.label }}
        run: |
          {
            echo "### clang-tidy findings on ${LABEL}"
            echo '```'
            grep -E ': (error|warning):' clang-tidy-report.txt || echo 'No findings.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Named per rung: upload-artifact refuses a name another leg already
      # used, so one name across the ladder fails whichever leg finishes second.
      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clang-tidy-report-${{ matrix.label }}
          path: clang-tidy-report.txt

  # One check name that does not move as rungs come and go, the way gcc.yml and
  # its siblings end. Callers require this rather than the individual legs.
  all:
    name: all
    needs: tidy
    # Not always(): that runs on cancellation too. See gcc.yml.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every leg succeeded
        env:
          RESULT: ${{ needs.tidy.result }}
        run: |
          set -euo pipefail
          echo "legs: $RESULT"
          # A skipped matrix means the ladder job failed or emitted nothing,
          # which is a red run, not an absent one.
          test "$RESULT" = success
