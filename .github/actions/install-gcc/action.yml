name: Install GCC
description: >
  Install a GCC by major version, from the Ubuntu toolchain PPA for a released
  one and from Jonathan Wakely's trunk snapshot for a development one. Serves
  both the GCC legs and the Clang legs, which need a matching libstdc++. A
  release the PPA's mirror refuses comes from the Launchpad librarian instead.

inputs:
  version:
    description: Major version, e.g. "15". With trunk, the version it reports.
    required: true
  trunk:
    description: Whether to install the trunk snapshot instead of a release.
    required: true
  symlink_binaries:
    description: >
      Whether a trunk install also puts gcc-N and g++-N on PATH. False when
      GCC is here only for its libstdc++, as on the Clang legs, where the
      shared-library path below is the whole point.
    required: false
    default: "true"
  multilib:
    description: >
      Whether a release install also brings the 32-bit runtime, for -m32. The
      trunk snapshot is built without it, so asking for both fails the step.
    required: false
    default: "false"
  source:
    description: >
      Where a release install comes from. "ppa" takes it through apt from the
      toolchain PPA, and from the Launchpad librarian when the PPA's mirror
      still refuses it after five attempts. "librarian" goes to the librarian
      directly, which is how this repository's self-check exercises that path.
    required: false
    default: "ppa"

runs:
  using: composite
  steps:
    - name: Install GCC ${{ inputs.version }}${{ inputs.trunk == 'true' && ' (trunk snapshot)' || '' }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        TRUNK: ${{ inputs.trunk }}
        SYMLINK_BINARIES: ${{ inputs.symlink_binaries }}
        MULTILIB: ${{ inputs.multilib }}
        SOURCE: ${{ inputs.source }}
      run: bash "$GITHUB_ACTION_PATH/install-gcc.sh"
