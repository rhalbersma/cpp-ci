name: Install the test dependencies
description: >
  vcpkg install, retried. When the runner's CMake is older than a port
  requires, vcpkg fetches its own from GitHub's release CDN, and that download
  fails intermittently -- twice in one hour here, once as HTTP 403 and once as
  an SSL connect error. vcpkg calls these "not a transient network error" and
  declines to retry, which is exactly backwards: the URL is fine and the next
  attempt usually succeeds. Retry the command itself, as the apt and wget
  steps elsewhere already do.

inputs:
  triplet:
    description: vcpkg triplet to install for.
    required: true
  overlay_triplets:
    description: Directory of overlay triplets, if the triplet is one.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Two spellings of one loop. The Windows legs run pwsh, as the workflows
    # they came from did: bash exists on those runners but the cache path
    # arrives with mixed separators, and PowerShell is what the rest of those
    # jobs speak.
    - if: runner.os != 'Windows'
      shell: bash
      env:
        TRIPLET: ${{ inputs.triplet }}
        OVERLAY_TRIPLETS: ${{ inputs.overlay_triplets }}
      run: |
        set -euo pipefail
        mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

        args=(install --triplet "$TRIPLET")
        if [ -n "$OVERLAY_TRIPLETS" ]; then
          args+=(--overlay-triplets "$OVERLAY_TRIPLETS")
        fi

        # Three attempts, backing off. A port that genuinely fails to build
        # fails the same way three times and still reddens the leg; only the
        # download flake is papered over, and the log keeps every attempt.
        for i in 1 2 3; do
          if vcpkg "${args[@]}"; then exit 0; fi
          if [ "$i" -eq 3 ]; then
            echo "::error::vcpkg install failed three times for triplet $TRIPLET"
            exit 1
          fi
          echo "::warning::vcpkg install failed, retrying (attempt $i of 3)"
          sleep $((i * 10))
        done

    - if: runner.os == 'Windows'
      shell: pwsh
      env:
        TRIPLET: ${{ inputs.triplet }}
        OVERLAY_TRIPLETS: ${{ inputs.overlay_triplets }}
      run: |
        # So a non-zero exit from vcpkg sets LASTEXITCODE for the loop to read
        # rather than terminating the step on the first attempt.
        $PSNativeCommandUseErrorActionPreference = $false
        New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

        $vcpkgArgs = @('install', '--triplet', $env:TRIPLET)
        if ($env:OVERLAY_TRIPLETS) {
          $vcpkgArgs += @('--overlay-triplets', $env:OVERLAY_TRIPLETS)
        }

        foreach ($i in 1..3) {
          & vcpkg @vcpkgArgs
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($i -eq 3) {
            Write-Host "::error::vcpkg install failed three times for triplet $env:TRIPLET"
            exit 1
          }
          Write-Host "::warning::vcpkg install failed, retrying (attempt $i of 3)"
          Start-Sleep -Seconds ($i * 10)
        }
