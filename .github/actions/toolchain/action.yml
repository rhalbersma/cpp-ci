name: Resolve toolchain
description: >
  Resolve rungs of a toolchain family to the compilers currently occupying
  them. In resolve mode that is one rung, reported as individual outputs; in
  matrix mode it is a set of rungs crossed with build types, reported as a
  strategy matrix. The rungs live in toolchains.json next to this action, so a
  release moves every calling repository at once: the callers name tiers, not
  versions, and never learn a version number.

inputs:
  mode:
    description: resolve for a single rung, matrix for a strategy matrix.
    required: false
    default: resolve
  toolchain:
    description: Toolchain family, a top-level key of toolchains.json.
    required: true
  tier:
    description: The rung, in resolve mode. One of stable, qualification, development.
    required: false
    default: ""
  tiers:
    description: Comma-separated rungs, in matrix mode. Absent rungs are dropped.
    required: false
    default: stable,qualification,development
  build_types:
    description: Comma-separated CMake build types to cross the rungs with.
    required: false
    default: Release,Debug
  reduce_on_pr:
    description: >
      Whether a pull_request event runs a reduced matrix: the first and last
      requested rungs -- the released floor and the moving ceiling -- in Debug
      alone. Pushes, schedules and dispatches always run the full set.

      False by default. The reduction was meant to keep four repositories from
      queueing behind each other on every review round, and it does, but it
      pays for that with the one event the gate exists to guard: a caller's
      required check is the "all" gate, which covers only the legs that ran,
      so a reduced pull request reports success having never compiled the
      middle rung. sanitizers.yml already refused the trade for its own
      reason; this is the same trade.
    required: false
    default: "false"

outputs:
  # Not every family fills every rung: Apple publishes no Clang trunk and
  # WinLibs publishes no MinGW one, so neither has a development. Callers
  # read supported and skip, rather than failing on a rung that was never
  # meant to exist.
  supported:
    description: Whether this family fills this rung, "true" or "false".
    value: ${{ steps.resolve.outputs.supported }}
  label:
    description: Human-readable rung name, e.g. "17-SVN".
    value: ${{ steps.resolve.outputs.label }}
  version:
    description: Major version of the compiler on this rung.
    value: ${{ steps.resolve.outputs.version }}
  trunk:
    description: Whether this rung is a development snapshot, "true" or "false".
    value: ${{ steps.resolve.outputs.trunk }}
  llvm_suffix:
    description: apt.llvm.org suite suffix; empty for the unversioned branch.
    value: ${{ steps.resolve.outputs.llvm_suffix }}
  gcc_version:
    description: Major version of the GCC supplying this Clang's libstdc++.
    value: ${{ steps.resolve.outputs.gcc_version }}
  gcc_trunk:
    description: Whether that GCC is a development snapshot.
    value: ${{ steps.resolve.outputs.gcc_trunk }}
  cxxflags:
    description: Flags this rung needs to find its standard library.
    value: ${{ steps.resolve.outputs.cxxflags }}
  matrix:
    description: Strategy matrix as JSON, in matrix mode.
    value: ${{ steps.matrix.outputs.matrix }}

runs:
  using: composite
  steps:
    - id: resolve
      if: inputs.mode == 'resolve'
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        TIER: ${{ inputs.tier }}
      run: |
        set -euo pipefail
        table="$GITHUB_ACTION_PATH/toolchains.json"

        # An unknown family is a typo in the caller and can only ever fail;
        # an unfilled rung is a fact about the world, reported as supported=false.
        if ! jq -e --arg t "$TOOLCHAIN" 'has($t)' "$table" > /dev/null; then
          echo "::error::unknown toolchain '$TOOLCHAIN'; known: $(jq -r 'keys | join(", ")' "$table")"
          exit 1
        fi
        case "$TIER" in
          stable|qualification|development) ;;
          *) echo "::error::unknown tier '$TIER'; expected stable, qualification or development"; exit 1 ;;
        esac

        entry=$(jq -c --arg t "$TOOLCHAIN" --arg r "$TIER" '.[$t][$r] // empty' "$table")
        if [ -z "$entry" ]; then
          echo "supported=false" >> "$GITHUB_OUTPUT"
          echo "::notice::$TOOLCHAIN has no $TIER rung"
          exit 0
        fi

        echo "supported=true" >> "$GITHUB_OUTPUT"
        # Absent keys stay unset rather than empty. A caller selecting between
        # two of these outputs writes "cond and a or b" in expression syntax,
        # which falls through to b whenever a is empty -- and "false" must not
        # read as empty. Expression syntax is deliberately not spelled out in
        # this comment: the template engine evaluates it even here, inside a
        # shell comment, and an undefined name there fails to load the action.
        jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$entry" >> "$GITHUB_OUTPUT"
        jq -r '"resolved \(.label)"' <<< "$entry"

    - id: matrix
      if: inputs.mode == 'matrix'
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        TIERS: ${{ inputs.tiers }}
        BUILD_TYPES: ${{ inputs.build_types }}
        REDUCE_ON_PR: ${{ inputs.reduce_on_pr }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail
        table="$GITHUB_ACTION_PATH/toolchains.json"

        if ! jq -e --arg t "$TOOLCHAIN" 'has($t)' "$table" > /dev/null; then
          echo "::error::unknown toolchain '$TOOLCHAIN'; known: $(jq -r 'keys | join(", ")' "$table")"
          exit 1
        fi

        IFS=',' read -r -a tiers <<< "$TIERS"
        IFS=',' read -r -a build_types <<< "$BUILD_TYPES"

        # A rung a family never fills is dropped rather than failing: the
        # caller asked for a ladder, not for this particular rung.
        requested=()
        for tier in "${tiers[@]}"; do
          tier="${tier// /}"
          if jq -e --arg t "$TOOLCHAIN" --arg r "$tier" '.[$t] | has($r)' "$table" > /dev/null; then
            requested+=("$tier")
          else
            echo "::notice::$TOOLCHAIN has no $tier rung, dropping it"
          fi
        done
        if [ ${#requested[@]} -eq 0 ]; then
          echo "::error::none of '$TIERS' is a rung $TOOLCHAIN fills"
          exit 1
        fi

        # The floor and the ceiling on a pull request, when a caller asks for
        # that. It is no longer the default: a push does still catch a break
        # that reaches only the middle rung, but it catches it after the merge
        # that introduced it, having reported the pull request green through
        # the very gate the caller marks required.
        if [ "$EVENT_NAME" = "pull_request" ] && [ "$REDUCE_ON_PR" = "true" ]; then
          if [ ${#requested[@]} -gt 2 ]; then
            requested=("${requested[0]}" "${requested[${#requested[@]}-1]}")
          fi
          for candidate in "${build_types[@]}"; do
            if [ "${candidate// /}" = "Debug" ]; then
              build_types=("Debug")
              break
            fi
          done
        fi

        include='[]'
        for tier in "${requested[@]}"; do
          entry=$(jq -c --arg t "$TOOLCHAIN" --arg r "$tier" '.[$t][$r]' "$table")
          for build_type in "${build_types[@]}"; do
            include=$(jq -c \
              --argjson acc "$include" \
              --argjson entry "$entry" \
              --arg tier "$tier" \
              --arg build_type "${build_type// /}" \
              -n '$acc + [$entry + {tier: $tier, build_type: $build_type}]')
          done
        done

        matrix=$(jq -c -n --argjson include "$include" '{include: $include}')
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
        jq -r '.include | "\(length) legs: " + ([.[] | "\(.label) \(.build_type)"] | join(", "))' <<< "$matrix"
