name: Make apt retry transient download failures
description: >
  The runner image writes APT::Acquire::Retries, but apt reads this setting
  from the Acquire group, so the image's value never takes effect. Set the key
  apt actually consults: without it a transient 5xx from a mirror or PPA fails
  the install on the first attempt, which is how one Launchpad brownout
  reddened three required legs. Run once per job, before any install action.

runs:
  using: composite
  steps:
    - shell: bash
      run: echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/99-retries > /dev/null
